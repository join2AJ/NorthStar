 purpose:"To make every person on site identifiable at a glance - by an ID card worn by all without exception and, for staff working inside, by a zone-coloured outer garment with a chest number or QR code visible from a distance - and to control the issue of cards and garments so that they cannot be misused.",
 scope:{applies:"Everyone on site: employees at every level including senior management and owners, contract workers and labour, trainees, drivers, vendors, auditors and visitors.",covers:"ID cards, visitor and temporary passes, zone dress code, chest number / QR identification, controlled issue and return, lost items.",excludes:"Access rights (SOP-04)."},
 defs:[["Zone dress","Outer garment (T-shirt, shirt, jacket, sweater or safety jacket) in the colour of the zone the wearer is authorised for."],["Chest number / QR","Unique number or QR code printed on the front and back of the zone dress, linked to the person's ID."]],
 resp:[["HR","Issues ID cards and zone dress after verification; keeps the issue registers."],["Security","Checks ID and zone dress at gates and inside; reports missing items; blocks lost cards."],["Every person","Wears the ID and zone dress as required and reports loss at once."]],
 steps:[["ID cards - for everyone",["Everyone on site wears a valid ID card, visibly, above the waist, at all times - whatever their role or seniority. This includes the leadership team, owners, guests of management, labour and vendors. Leaders wearing their ID set the example that makes the rule work for everyone, and guards are expected to ask courteously whenever an ID is not visible.","Cards are photo IDs issued only after background verification (SOP-17) and colour-coded by category as fixed in the site annexure.","A person without a visible ID is politely asked to display it; if none is available, the person is escorted to the security office and verified. Every case is recorded (F-05-02)."]],
  ["Zone dress code",["Staff working in Zones 2 and 3 wear the outer garment in the colour of their zone, with their chest number or QR printed large enough to be read from about 10 metres and on CCTV, front and back. The same marking applies to jackets, sweaters and safety jackets worn on top.","A person in a zone without the matching dress, or with no chest number / QR visible, is stopped and verified, and the case is reported (F-05-02) the same shift.","Each garment carries one or two security features known only to security staff, which allow a guard to tell a genuine garment from a copy. These features are described only in a restricted annexure held by the Security In-charge and are changed if they become known."]],
  ["Controlled issue and return",["ID cards and zone garments are stocked under lock and issued only against the issue register (F-05-01 / F-05-03) with serial number, size and recipient.","A lost card or garment is reported to security at once; the card is blocked within 1 hour and the loss is recorded before a replacement is issued.","Damaged garments are returned and destroyed under record. Cards, passes and garments are collected at exit or separation."]]],
 formats:[["F-05-01","ID issue and lost-card register",["Card no.","Name","Category / colour","Issued on","Lost on","Blocked at (time)","Replacement no.","Returned on"],"HR","Security In-charge","Per event; reviewed monthly"],
  ["F-05-02","ID and zone-dress non-compliance log",["Date / time","Location / zone","Person / department","Issue (no ID / wrong zone dress / no number)","Observed by","Action"],"Guard","Security In-charge daily; trends to the monthly meeting","Per event"],
  ["F-05-03","Zone dress issue register",["Serial / chest no.","Zone colour","Garment type / size","Issued to (ID)","Issued on","Returned / destroyed on","Sign"],"HR / Stores","Security In-charge","Per issue; stock check monthly"]],
 records:"ID and dress registers - employment period plus 1 year.",
 kpi:"100 % visible ID in spot checks, at all levels; lost cards blocked within 1 hour; monthly stock check of garments with zero unexplained loss.",
 ids:["AD-29","AD-30","W-02"]},

{no:"SOP-06",title:"Visitor and contractor management, and visitor data analysis",rev:"Plant Heads, HR Head",
 purpose:"To identify, authorise and escort every visitor and contractor, to close out every visit, and to analyse visitor data so that unusual patterns - at one plant or across plants - are noticed and acted on.",
 scope:{applies:"Visitors, vendors, customer and certification auditors, service engineers, contractors and their workers, and the employees who host them.",covers:"Pre-registration, gate procedure, escort, tools and material, work permits, exit, and monthly and quarterly visitor analysis.",excludes:"Goods vehicles (SOP-07)."},
 defs:[["Host","The employee who invites and is responsible for the visitor throughout the visit."],["Purpose category","One of the fixed reasons for visit listed in the visitor system (meeting, audit, service / repair, delivery, interview, contractor work, other)."]],
 resp:[["Host","Pre-registers the visitor, escorts in Zones 2-3, confirms exit."],["Security","Verifies ID, issues pass, checks tools, closes the visit."],["Security In-charge","Monthly visitor analysis for the site."],["Group Security Chief","Quarterly cross-plant analysis."]],
 steps:[["Visit procedure",["Visitors are pre-registered by the host in the visitor management system with a purpose category. At the gate, security verifies photo ID, captures a photo, issues a pass and informs the host.","Visitors are escorted in Zones 2 and 3. Photography needs written permission from the Plant Head.","Contract workers are verified and inducted before first entry; tools and material are declared at entry (F-06-01) and checked at exit. Hot work, work at height and electrical work need a valid work permit."]],
  ["Visitor data analysis",["Every month the Security In-charge reviews the visitor data (F-06-02): visitors by purpose and host department, repeat visitors (same person more than 4 times in a month), average and longest stay, overstays beyond the pass time, visits with no exit recorded, out-of-hours visits and visits to Zone 3.","Unusual patterns are discussed in the monthly site meeting with the host departments.","Every quarter the Group Security Chief analyses visitor data across all plants: the same person or company visiting several plants, unexplained increases, vendors with frequent unescorted visits, and overstays. Findings and actions are minuted in the quarterly review."]]],
 formats:[["F-06-01","Tool / material declaration",["Date","Contractor / name","Item","Qty","Serial no.","In time","Out time","Checked by"],"Gate guard","Supervisor every shift","Per entry"],
  ["F-06-02","Monthly visitor analysis",["Month","Total visitors","By purpose","By host department","Repeat visitors","Overstays","No exit recorded","Out-of-hours","Zone 3 visits","Actions"],"Security In-charge","Plant Head; Group Security Chief quarterly across plants","Monthly / quarterly"]],
 records:"Visitor data and declarations - 1 year (personal data handled as per the DPDP Act 2023); analysis reports - 3 years.",
 kpi:"100 % of visitors registered and closed out; monthly analysis issued by the 7th; cross-plant review every quarter.",
 ids:["AD-40","AD-41"]},

{no:"SOP-07",title:"Vehicle movement and parking",rev:"Plant Heads, Logistics",
 purpose:"To admit only authorised vehicles and drivers through defined gates, and to prevent material leaving hidden in any vehicle.",
 scope:{applies:"Goods vehicles, staff buses, cars, two-wheelers, and emergency and service vehicles.",covers:"Approved vehicle list, entry and exit checks, parking, overstay.",excludes:"Load documentation (SOP-08)."},
 defs:[["Approved vehicle list","Vehicles and drivers approved by Logistics for the site."]],
 resp:[["Logistics","Maintains the approved list and approves exceptions."],["Security","Checks vehicles and drivers; records movements."]],
 steps:[["Entry and exit",["Only vehicles on the approved list (F-07-01) are admitted through the vehicle gate; others need written Logistics approval before entry.","Driver ID and licence are checked and recorded; the vehicle is searched against the checklist (F-07-02) on entry and exit - cabin, body, underside and tool box.","Drivers wait in the driver area and do not enter Zone 2."]],
  ["Parking and overstay",["Vehicles park only in marked bays away from the boundary wall and critical areas.","Vehicles overstaying their slot, or refusing checks, are escalated to the Security In-charge."]]],
 formats:[["F-07-01","Approved transporter vehicle list",["Vehicle no.","Type","Transporter","Driver","Driver ID / licence","Valid till","Approved by"],"Logistics","Security In-charge","On change; reviewed monthly"],
  ["F-07-02","Vehicle check record",["Date","Vehicle no.","In / out time","Driver ID","Cabin / body / underside checked","Seal no.","Remarks","Guard sign"],"Gate guard","Supervisor every shift","Per vehicle"]],
 records:"Vehicle records - 1 year.",
 kpi:"100 % of vehicles checked and recorded; zero unlisted vehicles without approval.",
 ids:["AD-42","AD-43","W-03"]},

{no:"SOP-08",title:"Material movement - inward, outward, consumables, plant-to-plant transfers",rev:"Plant Heads, Logistics, Stores",
 purpose:"To make every movement of material into, out of and between Dixon plants authorised, documented and traceable, so that each plant knows exactly which material it receives from whom and sends to whom, on which document, through which gate.",
 scope:{applies:"Stores, Logistics, Purchase, production and Security at every plant.",covers:"Raw material, consumables, non-consumables and capital goods, returnable and non-returnable items, finished goods, rejected material, and transfers between Dixon plants.",excludes:"Scrap and e-waste disposal (SOP-09)."},
 defs:[["Consumables","Items used up in operations (e.g. solder, flux, packing material, cleaning material, stationery)."],["Non-consumables","Items that remain in use (e.g. tools, fixtures, jigs, IT equipment, instruments) - tracked by serial or asset number."],["RGP / NRGP","Returnable / non-returnable gate pass raised in SAP."],["e-gate pass","Gate pass generated in SAP and scanned at the gate; the electronic record replaces paper."]],
 resp:[["Stores / Logistics","Maintain the material flow matrix; raise gate passes; reconcile transfers and open RGPs."],["Security","Checks every load against the documents and seals; scans e-gate passes."],["Plant Head","Approves the material flow matrix and authorised signatories."]],
 steps:[["Material flow matrix",["Each plant keeps a material flow matrix (F-08-03) stating, for every category of material, the approved sources (suppliers, other Dixon plants) or destinations (customers, plants, job workers), the document required, the gate, the time window and the checks. Security uses only this matrix and the authorised signatory list to admit or release material.","The matrix is reviewed quarterly by Stores, Logistics and Security, and on any new supplier, customer or product line."]],
  ["Inward",["Inward material is checked at the material gate against PO, invoice and e-way bill; the seal number is verified against the document (F-08-01) before unloading. A mismatch stops unloading and is escalated.","Consumables and non-consumables follow the same check; non-consumables are recorded by serial / asset number."]],
  ["Outward",["No material leaves without an approved SAP gate pass checked against the physical load and the signatory list. Returnable items are recorded by serial number and their return is tracked.","Finished goods vehicles are sealed after loading; the seal number is on the gate pass and GPS tracking is active.","Open RGPs are reconciled weekly by Stores and reported in the monthly meeting."]],
  ["Plant-to-plant transfers",["Every transfer between Dixon plants - including hand-carried items between neighbouring plots - is made against a SAP stock transfer order with a delivery challan (and e-way bill where required) and an e-gate pass.","The sending gate scans the e-gate pass, records vehicle, seal and time, and closes it as 'dispatched'; the receiving gate scans it, verifies the seal and closes it as 'received'; Stores posts the receipt in SAP the same shift.","A transfer not received within 2 hours (same cluster) is flagged automatically to both Security In-charges, who investigate at once. The full electronic trail is kept (F-08-02)."]]],
 formats:[["F-08-01","Inward seal verification",["Date / time","Vehicle no.","Supplier","Invoice / e-way bill","Seal no. on document","Seal no. found","Match (Y/N)","Guard sign"],"Gate guard","Supervisor every shift; Stores daily","Per vehicle"],
  ["F-08-02","Plant-to-plant transfer trail",["STO / DC no.","e-gate pass no.","From plant / gate","To plant / gate","Material / qty","Seal no.","Dispatched at","Received at","Receipt posted (SAP)"],"System (sending and receiving gates)","Security In-charges of both plants daily","Per transfer"],
  ["F-08-03","Material flow matrix",["Category (RM / consumable / non-consumable / capital / FG / rejected / inter-plant)","Direction","Approved source or destination","Document required","Gate and hours","Checks at gate","Record / format","Owner"],"Stores and Logistics","Security In-charge and Plant Head","Quarterly"]],
 records:"Gate pass, seal and transfer records - 3 years (or as required by GST law, if longer).",
 kpi:"100 % of loads with matching documents and seals; 100 % of transfers closed 'received' within the time; open RGPs over 30 days reported monthly.",
 ids:["AD-44","AD-45","AD-46","W-03"]},

{no:"SOP-09",title:"Scrap and e-waste disposal",rev:"Plant Heads, EHS, Stores",
 purpose:"To prevent theft and leakage of components, rejected units and intellectual property through scrap and e-waste.",
 scope:{applies:"Stores, EHS and Security.",covers:"All scrap, rejected units, e-waste and hazardous waste leaving the site.",excludes:"Saleable goods."},
 defs:[],
 resp:[["Stores / EHS","Segregate, document and hand over to authorised recyclers."],["Security","Witnesses weighment and dispatch."]],
 steps:[["Storage and dispatch",["Scrap is stored in a locked, segregated yard; e-waste and rejected units are kept separately under key control.","Scrap leaves only with a gate pass and weighment slip, weighed with a security guard present (at an external weighbridge if none on site).","E-waste and rejected units are handed only to authorised recyclers; the certificate of destruction is filed against each manifest."]]],
 formats:[["F-09-01","Scrap dispatch record",["Date","Gate pass no.","Material","Gross / tare / net","Weighbridge","Witnessed by","Recycler / certificate no."],"Stores","Security In-charge","Per dispatch; reviewed monthly"]],
 records:"Manifests, weighment slips and certificates - 5 years.",
 kpi:"Certificate on file for 100 % of e-waste disposals.",
 ids:["AD-47","AD-48"]},

{no:"SOP-10",title:"Key control (manual and electronic)",rev:"Plant Heads",
 purpose:"To know at every moment who holds the key to every lockable area, whether keys are kept in a manual cabinet or an electronic key management system.",
 scope:{applies:"Security and every key holder.",covers:"All keys including master and duplicate keys, padlocks and utility keys.",excludes:"Electronic access cards (SOP-04)."},
 defs:[["Electronic key cabinet","Cabinet that releases a key only to an authorised user by PIN, card or biometric and logs every issue and return."]],
 resp:[["Security","Holds the cabinet and register; runs the monthly audit."],["Zone owner","Approves who may draw keys of his or her area."]],
 steps:[["Custody",["All keys are numbered and tagged and kept in a locked key cabinet at the security office. Master and duplicate keys are kept sealed and opened only with Security In-charge approval.","Utility keys (DG, HV panel, transformer, HSD, roof) are never kept near the equipment."]],
  ["Issue and return",["Manual system: keys are issued only to persons on the area's authorised list and recorded in the key register (F-10-01).","Electronic system: the cabinet releases a key only to authorised users; overdue keys raise an alarm in the control room; the system log replaces the paper register and is exported monthly.","Keys are returned the same shift unless approved otherwise."]],
  ["Audit",["A monthly key audit (F-10-02) compares cabinet, register or system log; a missing key is treated as an incident and the lock is changed if the key is not found within 24 hours."]]],
 formats:[["F-10-01","Key register",["Key no.","Area","Issued to","Time out","Purpose","Time in","Guard sign"],"Guard","Supervisor every shift","Per issue"],
  ["F-10-02","Monthly key audit",["Month","Keys in register","Keys in cabinet","Missing / untagged","Action","Audited by"],"Security In-charge","Plant Head","Monthly"]],
 records:"Key registers, system logs and audits - 1 year.",
 kpi:"Zero unexplained keys in the monthly audit; overdue keys alarmed and followed up.",
 ids:["AD-34","W-07","W-10"]},

{no:"SOP-11",title:"Video surveillance, alarms, footage handling and control room",rev:"Plant Heads, IT Head",
 purpose:"To make sure every area of the site is covered at the level its risk requires, that alarms are answered, and that recorded footage is viewed, exported and shared only by authorised persons through a traceable process that preserves it as evidence and protects privacy.",
 scope:{applies:"Control room operators, Security In-charges, IT, investigators and the CCTV maintenance vendor.",covers:"Camera coverage, recording and retention, alarms, monitoring, viewing and export of footage, secure sharing, evidence copies.",excludes:"Physical maintenance details (SOP-15)."},
 defs:[["Critical coverage","Gates, Zone 3 areas, docks and dispatch, high-value stores, perimeter blind spots."],["Normal coverage","Production floors, corridors, parking, canteen, stores aisles."],["Non-critical coverage","Open yards and general areas with low risk."],["Bookmark","A marker an operator places on the timeline to flag an event without exporting it."],["PAM server","Privileged access management server through which footage is shared securely over VPN with individual log-in and session recording."]],
 resp:[["Control room operator","Monitors live, answers alarms, logs events and faults, bookmarks events. No export rights."],["Security In-charge","Approves and performs export with his or her own senior ID; maintains the evidence store."],["IT","Configures user rights, retention, USB restriction, PAM / VPN and health alerts."],["Investigator","Downloads approved footage through PAM only to a designated laptop."]],
 steps:[["Coverage",["Every area of the site is assigned a coverage class on the camera layout: critical, normal or non-critical. Critical areas need identification-quality images at entry points (face and vehicle number readable), continuous recording and live monitoring; normal areas need recognition-quality images and continuous recording; non-critical areas may record on motion.","No camera covers toilets, changing rooms or prayer rooms.","Coverage is checked against the layout every quarter and after any layout change; blind spots are recorded and closed."]],
  ["Recording and retention",["Retention: critical cameras at least 90 days; normal and non-critical at least 30 days; longer where a customer or law requires it. Footage linked to an incident is kept until the case is closed plus 1 year.","NVR health, HDD, recording-stop, video-loss and camera-tamper alerts are configured to the control room and acted on within 1 hour."]],
  ["Alarms and monitoring",["Alarms - video loss, tamper / defocus, line crossing or motion in restricted zones after hours, door-forced and door-held-open - are shown in the control room, answered within 2 minutes and logged (F-11-01).","The operator watches critical cameras continuously and cycles normal cameras; events are bookmarked with a short description."]],
  ["Viewing and export",["Operator IDs can view live and play back recent footage for an alarm or event, and can bookmark it, but have no export rights.","Any request to view past footage beyond the current event, or to export, is made on the footage request (F-11-02) stating requester, cameras, date and time window, and reason, and is approved by the Security In-charge (Plant Head for requests from outside the company).","Export is done only with the Security In-charge's own senior ID. Every viewing and export - who, which camera, which time window, when - is recorded by the system and in F-11-02.","A copy of every exported clip is kept on the company evidence server (write-protected), with its hash value, for the retention period above."]],
  ["Secure sharing",["USB and removable media ports on NVRs and VMS workstations are disabled; footage is never handed over on pen drives.","Footage is shared through the PAM server over VPN. The authorised investigator logs in with an individual or investigation ID (with multi-factor log-in), and downloads only to one of two designated non-domain laptops kept under the custody of the Security In-charge and IT. PAM records every session."]]],
 formats:[["F-11-01","Control room log",["Date / time","Camera / area","Event, alarm or fault","Bookmark ref.","Action","Escalated to","Operator ID"],"Control room operator","Supervisor every shift; Security In-charge daily","Continuous"],
  ["F-11-02","Footage request, viewing and export register",["Request no.","Requested by","Cameras","Date / time window","Reason","Approved by","Viewed / exported by (ID)","Evidence server ref. / hash","Shared via PAM to"],"Requester and Security In-charge","Plant Head monthly","Per request"],
  ["F-11-03","Quarterly coverage check",["Area","Coverage class","Cameras","Image quality OK (Y/N)","Blind spot","Action","Checked by"],"Security In-charge with IT","Plant Head","Quarterly"]],
 records:"Control room logs and footage registers - 3 years; evidence clips - case closure plus 1 year.",
 kpi:"Monitoring ≥ 98 % of the shift; alarms answered within 2 minutes; 100 % of exports approved and copied to the evidence server; zero USB exports.",
 ids:["AD-35","AD-36","AD-37","AD-38","W-05","W-06"]},

{no:"SOP-12",title:"Frisking and prohibited items",rev:"Plant Heads, HR Head",
 purpose:"To screen people consistently and respectfully, and to stop prohibited items from entering and company material from leaving.",
 scope:{applies:"Everyone entering or leaving production and restricted areas and the site, at every level.",covers:"Prohibited items list, frisking method, exceptions.",excludes:"Vehicle search (SOP-07)."},
 defs:[["Prohibited items","Items listed in step 1, not allowed past the point shown."]],
 resp:[["Guards","Carry out frisking as trained; same-gender frisking."],["Supervisor","Checks method, handles exceptions."],["Plant Head","Approves exceptions to the list."]],
 steps:[["Prohibited items",["Not allowed on site: firearms, weapons and ammunition; explosives and fireworks; knives, blades and cutters (except issued tools); alcohol, narcotics, tobacco, gutkha and pan masala; lighters, matches and inflammable liquids.","Not allowed in production and restricted areas (Zones 2-3) unless approved in writing: personal mobile phones and smartwatches with cameras; cameras and recording devices; USB drives, memory cards and external hard disks; personal laptops and tablets; outside food and drinks; magnets and ESD-unsafe personal items; personal bags.","Not allowed to leave without a gate pass: any company material, components, PCBs, finished or rejected units, tools, documents or drawings.","The list is displayed at every gate and in the induction; mobile phones and bags are kept in numbered lockers at the entry point."]],
  ["Frisking method",["The person stands with both arms raised. The HHMD is held about 3 cm from the body and moved head to toe, front then back, including arms and legs; footwear, belt, pockets and bags are checked separately.","Women are frisked only by female guards in a screened booth.","Every alarm that cannot be resolved and every prohibited item found is recorded (F-12-01) and escalated to the supervisor."]]],
 formats:[["F-12-01","Frisking exception register",["Date / time","Gate / exit","Name / ID","Item found / alarm","Action","Supervisor","Guard sign"],"Frisking guard","Supervisor every shift; Security In-charge weekly","Per event"]],
 records:"Exception register - 1 year.",
 kpi:"100 % of exits screened; exceptions recorded and resolved.",
 ids:["AD-51","AD-64","W-07"]},

{no:"SOP-13",title:"Incident reporting, investigation, RCA and learning",rev:"Plant Heads, HR Head",
 purpose:"To report every security incident and near-miss quickly, contain it, find its root cause, correct and prevent it, and share the lesson across all Dixon plants so the same incident does not happen elsewhere.",
 scope:{applies:"All employees, contract staff and security personnel.",covers:"Theft, pilferage, trespass, tailgating, assault or threat, sabotage, fraud, IP or data leakage, access violations, vehicle incidents, lost IDs, alarms and near-misses.",excludes:"Pure safety accidents (EHS procedure), except where security is involved."},
 defs:[["Severity S1","Critical - injury, major loss, IP leakage, sabotage, police case."],["Severity S2","Major - theft or loss, breach of Zone 3, repeat incident."],["Severity S3","Minor - access or ID violation, small loss."],["Severity S4","Near-miss - could have caused loss but did not."],["5-Why","Asking 'why' repeatedly until the underlying system cause is found."]],
 resp:[["Any person","Reports immediately."],["Security In-charge","Logs, contains, preserves evidence, assigns the investigator."],["Investigator","Investigation, RCA and CAPA."],["Plant Head / Group Security Chief","Review S1-S2 incidents and trends; GSC shares lessons across plants."]],
 steps:[["Reporting and containment",["Every incident and near-miss is reported to the Security In-charge at once and logged (F-13-01) within 1 hour. S1 incidents are reported to the Plant Head and Group Security Chief immediately and in writing within 24 hours.","The scene and CCTV footage are preserved (SOP-11); police are informed where required."]],
  ["Investigation and RCA",["S1 and S2: a nominated investigator completes the report (F-13-02) within 7 days with a 5-Why analysis and, where several causes interact, a fishbone (cause-and-effect) diagram covering people, process, technology, environment and supervision.","S3 and S4: a short 5-Why is enough, completed within 3 days.","Corrective and preventive actions (CAPA) are assigned with owners and dates; the root cause is a system cause, not just 'guard negligence'."]],
  ["Learning",["The Group Security Chief issues a lessons-learnt note (F-13-03) for every S1-S2 incident within 14 days to all plants; each plant confirms whether the same weakness exists there.","CAPA effectiveness is verified after 30 and 90 days; trends are reviewed monthly and quarterly."]]],
 formats:[["F-13-01","Incident register",["Incident no.","Date / time","Location","Type","Severity","Reported by","Immediate action","Investigator","Status"],"Security In-charge","Plant Head monthly","Per incident"],
  ["F-13-02","Investigation and RCA report",["Incident no.","Facts","Evidence","Why 1 … Why 5","Root cause","CAPA","Owner / date","Effectiveness check (30 / 90 days)"],"Investigator","Plant Head; GSC for S1-S2","Per incident"],
  ["F-13-03","Lessons-learnt note",["Incident ref.","What happened","Why","What changed","Applies to plants","Confirmation from each plant"],"Group Security Chief","Business Head (S1)","Per S1-S2 incident"]],
 records:"Incident records - 5 years.",
 kpi:"100 % of incidents logged within 1 hour; RCA on time; CAPA effective at 90 days; lessons shared for 100 % of S1-S2 incidents.",
 ids:["AD-15","AD-53","AD-54"]},

{no:"SOP-14",title:"Emergency response (security role) and site-specific drills",rev:"Plant Heads, EHS Head",
 purpose:"To define emergency categories and security's role in each, so that people are safe, the site is secured and emergency services are helped - and to test the response through drills based on the real risks of each site.",
 scope:{applies:"Security personnel, the emergency response team and all occupants.",covers:"Emergency categories and levels, security actions, fail-safe doors, headcount, drills.",excludes:"Fire-fighting technique (EHS)."},
 defs:[["Level 1","Local - handled by the site team."],["Level 2","Site - needs external services or evacuation."],["Level 3","Off-site / corporate - affects neighbours, multiple plants or the business; Group crisis team involved."]],
 resp:[["Security In-charge","Leads security response, gate control and headcount support."],["EHS","Owns the Emergency Response Plan and the drill calendar."],["Guards","Act as per scenario cards."]],
 steps:[["Emergency categories",["Category A - fire, explosion, gas or HSD leak. Category B - natural: flood and waterlogging (including Dunga Dhara overflow), earthquake (Seismic Zone IV), storm. Category C - security: intrusion, bomb threat or suspicious object, sabotage, armed threat. Category D - civil: labour unrest, strike, protest, road blockade. Category E - medical emergency and mass illness. Category F - utility and IT: prolonged power failure, system outage.","Each site records in its annexure which categories apply and how severe they could be, from its risk assessment."]],
  ["Security actions",["Scenario cards for each category are kept at every post and in the control room.","On fire alarm and on power failure, access-controlled doors on escape routes release automatically; the release is tested every quarter (F-14-01).","Gates are cleared for emergency vehicles; no one re-enters until the all-clear; headcount at the assembly point is reconciled with biometric attendance, visitors and contractors."]],
  ["Drills",["The drill calendar (F-14-02) covers every applicable category at least once a year, chosen from the site's own risks - for example flood at plants near the Dunga Dhara, earthquake at all plants, HSD fire where diesel is stored, bomb threat and unrest at all plants. Fire evacuation is drilled at least twice a year.","Each drill is evaluated (time, headcount accuracy, gaps) and actions are tracked to closure."]]],
 formats:[["F-14-01","Fail-safe door test",["Date","Door / location","Released on alarm (Y/N)","Released on power failure (Y/N)","Defect","Tested by"],"Security with Maintenance","EHS","Quarterly"],
  ["F-14-02","Site drill calendar and evaluation",["Category / scenario","Planned month","Done on","Evacuation time","Headcount match (Y/N)","Gaps","Actions / owner"],"EHS with Security","Plant Head; GSC quarterly","Yearly plan; per drill"]],
 records:"Drill and test records - 3 years.",
 kpi:"Fail-safe release 100 % in quarterly tests; every applicable category drilled each year; headcount reconciled within the drill target.",
 ids:["AD-55","AD-56","AD-57","AD-58","AD-59","AD-60","AD-62","W-09"]},

{no:"SOP-15",title:"Security equipment checks and maintenance",rev:"Plant Heads, IT Head",
 purpose:"To keep all security equipment working and tested, so that a failed device is found by a test, not by an incident.",
 scope:{applies:"Security, Maintenance, IT and AMC / CAMC vendors.",covers:"DFMD, HHMD, CCTV, access control, boom barriers, turnstiles, alarms, radios, PA, lighting.",excludes:"—"},
 defs:[],
 resp:[["Guards","Daily function tests."],["Security In-charge / Maintenance / IT","Preventive maintenance and vendor follow-up."]],
 steps:[["Tests and maintenance",["DFMD and HHMD are tested at the start of every shift with a test piece (F-15-01); a failed device is reported and replaced the same day.","Preventive maintenance of CCTV, access control, barriers, turnstiles and alarms follows the AMC / CAMC schedule and is signed off by the vendor and Security.","Radios and PA are checked daily; perimeter lighting is checked on every night patrol."]]],
 formats:[["F-15-01","Equipment function-test register",["Date / shift","Equipment / location","Result (pass / fail)","Action","Guard sign"],"Guard","Supervisor every shift; Security In-charge weekly","Every shift"]],
 records:"Test registers and PM reports - 1 year.",
 kpi:"100 % of daily tests recorded; no device out of service for more than 24 hours.",
 ids:["AD-39","AD-64","AD-65","AD-66","AD-67"]},

{no:"SOP-16",title:"Security contracts and vendor management (manpower, AMC, CAMC)",rev:"Plant Heads, Purchase / Admin",
 purpose:"To ensure security services and systems are contracted with clear obligations, that service providers follow Dixon's SOPs, and that performance and statutory compliance are checked every month.",

function makeOpenPoints(){
  const scs=Array.from(document.querySelectorAll("#nc-sites input:checked")).map(x=>x.value),mand=$("#nc-mand").checked;
  if(!scs.length){toast("Tick at least one site.");return;}
  lsSet("sa.ncSites",scs.join(","));
  openDoc(("Dixon_Selaqui_Points_Not_Covered_"+scs.map(sc=>"Site"+SITE[sc].no).join("_")+(mand?"_Mandatory":"")),()=>{
    const groups=[["Documents - pre-audit",it=>it.sec==="doc"&&it.when==="Pre-audit"],["Documents - on-site",it=>it.sec==="doc"&&it.when==="On-site"],["Physical walkthrough",it=>it.sec==="walk"],["Stakeholder interviews",it=>it.sec==="int"]];
    let total=0;const body=scs.map(sc=>{const S=SITE[sc],R=resSite(sc);
      const open=itemsFor(sc).filter(it=>(!mand||it.mand)&&!["covered","na"].includes(ptState(sc,it)));total+=open.length;
      return '<section class="'+(sc===scs[0]?"":"pb")+'"><h2>'+esc(S.no+". "+S.name)+' - '+open.length+' point'+(open.length===1?"":"s")+' open</h2><div class="muted">'+esc(R.addr||S.addr)+(R.spoc?' · SPOC '+esc(R.spoc)+(R.spocPhone?' '+esc(fmtPhone(R.spocPhone)):''):'')+'</div>'+
        (open.length?groups.map(([l,f])=>{const xs=open.filter(f);return xs.length?'<h3>'+l+' ('+xs.length+')</h3><table><tr><th style="width:52px">ID</th><th>Document / requirement</th><th style="width:70px">Priority</th><th style="width:80px">Status</th><th style="width:30%">Remarks / document shared</th></tr>'+
          xs.map(it=>{const p=D.pts.get(pkey(sc,it));return '<tr><td><b>'+it.id+'</b></td><td>'+esc(it.text)+(it.cat&&it.sec==="doc"?'<div class="muted">'+esc(it.cat)+'</div>':'')+'</td><td>'+(it.mand?"Mandatory":"Desirable")+'</td><td>'+(p?"In progress":"Not covered")+'</td><td></td></tr>';}).join("")+'</table>':'';}).join(""):'<p class="muted">Nothing open - all '+(mand?"mandatory ":"")+'points are covered.</p>')+'</section>';}).join("");
    return '<section><div class="brand">Northstar Safety Systemz · Security audit · NSS/DTIL/SECA/2026-07/01</div><h1 style="font-size:20pt">Points not covered'+(mand?" - mandatory":"")+'</h1>'+

}

    const MCSS='<style>.fmt .fl{display:none}@media screen and (max-width:700px){.stk tr:first-child{display:none}.stk,.stk tbody,.stk tr,.stk td{display:block;width:auto!important}.stk tr{border:1px solid #D0DAD7;border-radius:8px;margin:8px 0;padding:4px 8px;background:#fff}.stk td{border:0;padding:3px 0}.stk td::before{content:attr(data-l);display:block;font-size:7.8pt;font-weight:700;color:#0E5A61;text-transform:uppercase;letter-spacing:.3px}.stk td:first-child::before{display:none}.stk td.rc{display:inline-block;width:auto!important;padding:4px 8px;border-radius:6px}.hd,.hd tbody{display:block}.hd tr{display:grid;grid-template-columns:38% 62%}.hd th,.hd td{display:block}.fmt table{display:none}.fmt .fl{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}.fmt .fl span{background:#EEF4F3;border:1px solid #D0DAD7;border-radius:12px;padding:1px 8px;font-size:8.5pt}.fmt{border:1px solid #D0DAD7;border-radius:8px;padding:6px 8px}table th[style*="width"]{width:34%!important}h2{font-size:13pt}ol{padding-left:18px}}</style>';

    let b=MCSS+docCover("Corporate-Level Security SOP Set","Dixon Technologies - Selaqui operations",'<tr><th>Applies to</th><td>'+SITES.map(s=>esc(s.no+". "+s.name)).join("; ")+'</td></tr><tr><th>Sites audited</th><td>'+done.map(s=>esc(s.no+". "+s.name)).join(", ")+'</td></tr>');
    b+='<section class="pb"><h2>A. Document hierarchy - what each type of document means</h2>'+T(["Type","What it is","Approved by","Review"],DOC_TYPES)+
     '<p class="muted">Order of authority: Policy → Manual / Site Security Plan → Procedures → SOPs → Work instructions → Formats → Records. A lower document may not contradict a higher one.</p>'+
     '<h2>B. Governance</h2><h3>Approval matrix - no document is approved by the person who prepared it</h3>'+T(["Document","Prepared by","Reviewed by","Approved by"],[["Security policy","Group Security Chief","Plant Heads, HR Head","Business Head"],["Manual / Site Security Plan","Security In-charge (site)","Plant Head, EHS, HR","Group Security Chief"],["SOPs (this set)","Group Security office / Security In-charge","Plant Heads; HR, EHS, IT, Logistics as relevant","Group Security Chief"],["Site annexure, work instruction, format","Security In-charge","Zone owners, agency supervisor","Plant Head"]])+
     '<h3>Withdrawal, suspension and exceptions</h3>'+T(["Action","Who may do it","Conditions"],[["Withdraw / revoke an SOP","Group Security Chief only","Change request stating the reason and what replaces it; withdrawn version archived, never deleted"],["Suspend a clause in an emergency","Plant Head","Up to 72 hours; Group Security Chief informed in writing within 24 hours; lapses unless a change is approved"],["Approve a deviation up to 7 days","Plant Head","Deviation request with risk and compensating control; logged and reviewed monthly"],["Approve a deviation over 7 days, in Zone 3, or repeated","Group Security Chief","Maximum 30 days, renewable once"],["No deviation possible","—","Statutory requirements, life-safety provisions, wearing of ID by everyone"],["Delete a document","Nobody","Documents are only made obsolete and archived"]])+
     '<h3>Review cadence</h3>'+T(["Forum","Frequency","Chaired by","Agenda"],[["Site security meeting","Monthly","Plant Head","Incidents, near-misses, patrol and surprise-check findings, CAPA, deployment and attendance reconciliation, visitor analysis, deviations, system health, overdue documents"],["Security review with the Group Security Chief","Quarterly","Group Security Chief","Site KPIs, cross-plant trends and visitor analysis, access reviews, contracts and SLA, audit actions, SOP changes"],["Management review","Half-yearly","Business Head","Security risk register, investments (Operational Requirement), customer requirements, resources"],["Annual review","Yearly","Group Security Chief","Policy, manual, every SOP and Site Security Plan; risk assessment refresh; drill and training calendars"]])+
     '<h3>Group Security Chief</h3><p>The Group Security Chief owns this SOP set and the master list, approves SOPs, withdrawals, long deviations and security contracts, chairs the quarterly review with every site, analyses incidents and visitor data across all plants, issues lessons-learnt notes, receives serious-incident reports within 24 hours, and visits each site at least once a year. Site Security In-charges report functionally to the Group Security Chief and administratively to their Plant Head.</p>'+

     '<p>Examples: <b>DIX-GLB-00-000-CORP-SEC-POL-001-R00</b> (group security policy) · <b>DIX-IN-00-000-CORP-SEC-SOP-003-R00</b> (patrolling SOP, all India) · <b>DIX-IN-UK-DDN-SEL03-SEC-SSP-001-R00</b> (Site Security Plan, site 3) · <b>DIX-IN-UK-DDN-SEL03-SEC-WI-002-R00</b> (work instruction, site 3). Gates follow the site code (SEL03-G01) and formats follow their SOP (F-03-01 within SOP-03).</p>'+
     '<h3>One platform and revision control</h3><ul><li>All security documents live on one controlled document platform (DMS / SharePoint) with the master list; only the current revision is visible for use.</li><li>Each document carries a revision history (rev., date, change, approved by); changes are made only through a change request (F-01-01).</li><li>Printed copies are stamped "Controlled copy" with a copy number and recalled on revision; other prints are marked "For information only".</li><li>Edit rights are limited to the document owner; reviewers and approvers sign digitally on the platform, which keeps the audit trail.</li><li>Restricted annexures (such as garment security features) are held with restricted access and not distributed.</li></ul></section>';
    b+='<section class="pb"><h2>D. SOP index and the audit gaps each closes</h2><table class="stk"><tr><th>No.</th><th>SOP</th><th>Document no.</th><th>Closes gaps at</th></tr>'+SOPS.map(x=>{const hits=done.filter(s=>gapAt(s,x.ids).length);return '<tr><td><b>'+x.no+'</b></td><td data-l="SOP">'+esc(x.title)+'</td><td data-l="Document no." style="overflow-wrap:anywhere">'+dn(x.no)+'-R00</td><td data-l="Closes gaps at">'+(hits.length===done.length?'All sites audited':hits.map(s=>s.no+". "+esc(s.name)).join(", ")||'<span class="muted">-</span>')+'</td></tr>';}).join("")+'</table></section>';
    for(const x of SOPS){
      const gaps=done.flatMap(s=>gapAt(s,x.ids));
      b+='<section class="sop"><h2>'+x.no+' · '+esc(x.title)+'</h2><table class="hd"><tr><th>Document no.</th><td>'+dn(x.no)+'</td><th>Revision</th><td>R00 (draft)</td></tr>'+

        '<h3>1. Purpose</h3><p>'+esc(x.purpose)+'</p><h3>2. Scope</h3><table><tr><th style="width:22%">Applies to</th><td>'+esc(x.scope.applies)+'</td></tr><tr><th>Covers</th><td>'+esc(x.scope.covers)+'</td></tr>'+(x.scope.excludes&&x.scope.excludes!=="—"?'<tr><th>Does not cover</th><td>'+esc(x.scope.excludes)+'</td></tr>':'')+'</table>'+
        (x.defs.length?'<h3>3. Definitions</h3><table>'+x.defs.map(d=>'<tr><th style="width:28%">'+esc(d[0])+'</th><td>'+esc(d[1])+'</td></tr>').join("")+'</table>':'<h3>3. Definitions</h3><p class="muted">As in Sections A-C.</p>')+
        '<h3>4. Responsibilities</h3><table>'+x.resp.map(r=>'<tr><th style="width:28%">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join("")+'</table>'+

function renderExpenses(){
  const all=D.exp;
  let list=all;
  if(ui.expWho!=="all")list=list.filter(x=>x.e.author===ui.expWho);
  if(ui.expSt!=="all")list=list.filter(x=>x.status===ui.expSt);
  const sum=(arr)=>arr.reduce((a,x)=>a+x.amount,0);
  const live=all.filter(x=>x.status!=="rejected");
  let h='<div class="tiles" style="margin-top:10px">'+
   '<div class="tile"><div class="l">Total claimed</div><div class="v">'+inr(sum(live))+'</div><div class="s">'+live.length+' claim'+(live.length===1?"":"s")+' (excl. rejected)</div></div>'+
   '<div class="tile"><div class="l">Still to be paid</div><div class="v">'+inr(sum(live.filter(x=>x.status!=="paid")))+'</div><div class="s">'+inr(sum(all.filter(x=>x.status==="paid")))+' paid so far</div></div>'+
   Object.keys(USERS).map(u=>{const m=live.filter(x=>x.e.author===u);return '<div class="tile" style="border-top:4px solid var(--'+u+')"><div class="l">'+esc(USERS[u].name)+'</div><div class="v">'+inr(sum(m))+'</div><div class="s">'+inr(sum(m.filter(x=>x.status!=="paid")))+' pending</div></div>';}).join("")+'</div>';
  h+='<div class="card" style="margin-top:10px"><div class="card-t">By status</div>'+stackBar(CLAIM_ST.map(([k,l,c])=>({n:sum(all.filter(x=>x.status===k)),c:cv(c),l})),true,"Amount")+
   '<div class="legend" style="margin-top:8px">'+CLAIM_ST.map(([k,l,c])=>'<span><i style="--pc:'+cv(c)+'"></i>'+l+' '+inr(sum(all.filter(x=>x.status===k)))+'</span>').join("")+'</div></div>';
  h+='<div class="btn-row"><button class="btn primary" data-act="newexp">+ Add expense</button><button class="btn" data-act="expcsv">Export claims (CSV)</button></div>';
  h+='<div class="seg" style="margin:12px 0 0">'+[["all","Both"]].concat(Object.keys(USERS).map(u=>[u,USERS[u].short])).map(([k,l])=>'<button type="button" data-act="expwho" data-v="'+k+'" class="'+(ui.expWho===k?"on":"")+'">'+l+'</button>').join("")+'</div>'+
   '<div class="filters"><select id="exp-st"><option value="all">All statuses</option>'+CLAIM_ST.map(([k,l])=>'<option value="'+k+'"'+(ui.expSt===k?" selected":"")+'>'+l+'</option>').join("")+'</select><div class="small muted" style="align-self:center">'+list.length+' shown · '+inr(sum(list))+'</div></div>';
  h+=list.length?list.map(expCard).join(""):'<div class="empty">No expenses logged yet. Tap “+ Add expense” and attach the bill or a screenshot.</div>';
  return h;
}

function csvCell(v){if(v==null)v="";v=String(v).replace(/\r?\n/g," | ");return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
const toCSV=rows=>"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");

    case "claimst":setClaim(v,t.dataset.k);break;
    case "expwho":ui.expWho=v;render();break;
    case "expcsv":download("selaqui_expense_claims_"+dayKey(new Date().toISOString())+".csv",expCSV());break;
    case "infosec":ui.info=v;window.scrollTo(0,0);render();break;
    case "photowho":ui.feedWho=v;ui.photoN=60;render();break;
    case "morephotos":ui.photoN+=60;render();break;
    case "gallery":ui.tab="feed";ui.feedView="photos";lsSet("sa.tab","feed");window.scrollTo(0,0);render();break;
    case "dlphoto":dlPhoto(v);break;
    case "filter":ui.filter=v;render();break;
    case "open":if(ui.sheet&&ui.sheet.type==="pending"){ui.sheet=null;}if(!v){if(t.dataset.s){ui.feedSite=t.dataset.s;ui.tab="feed";render();}break;}openPoint(v,t.dataset.s||ui.scope);break;
    case "close":requestClose();break;
    case "newnote":openNote();break;
    case "visit":logVisit(v,t.dataset.k);break;
    case "gps":startGeo(true);toast("Looking for GPS… allow location if asked.");break;
    case "syncnow":scheduleSync(0);toast("Syncing…",1500);break;
    case "feedwho":ui.feedWho=v;ui.feedN=60;ui.tab="feed";ui.feedView="entries";render();break;
    case "more":ui.feedN+=60;render();break;
    case "feedview":ui.feedView=v;if(v==="trail")trailCache=null;render();break;
    case "trailreload":trailCache=null;render();break;
    case "trailwho":ui.feedWho=v;render();break;
    case "csv3":try{const r=await api("trail");download("selaqui_audit_trail_"+dayKey(new Date().toISOString())+".csv",trailCSV(r.activity));}catch(e){toast(e.message);}break;
    case "dset":readDraft();draft[t.dataset.f]=draft[t.dataset.f]===v?"":v;renderSheet();break;
    case "addph":openEdit(v,"add");break;
    case "editobs":openEdit(v,"edit");break;
    case "cancelmode":readDraft();{const d=draft;draft=newDraft(d.kind==="note"&&ui.sheet.type==="point"?"point":d.kind,d.scope,d.item);}renderSheet();break;
    case "dsop":readDraft();draft.sop=draft.sop.includes(v)?draft.sop.filter(x=>x!==v):draft.sop.concat(v);renderSheet();break;
    case "devid":readDraft();draft.evid=draft.evid.includes(v)?draft.evid.filter(x=>x!==v):draft.evid.concat(v);renderSheet();break;
    case "drm":readDraft();{const p=draft.photos.splice(Number(v),1)[0];if(p)URL.revokeObjectURL(p.url);}renderSheet();break;
    case "cam":$("#pick-cam").click();break;
    case "gal":$("#pick-gal").click();break;
    case "save":saveDraft();break;
    case "zoom":zoom(v);break;
    case "withdraw":withdraw(v);break;
    case "lwho":loginWho=v;showLogin();break;
    case "signout":signOut(false);break;
    case "pw":{const o=prompt("Current password");if(o==null)break;const n=prompt("New password (at least 8 characters)");if(!n)break;
      try{await api("password",{oldPassword:o,newPassword:n});toast("Password changed.");}catch(e){toast(e.message,4500);}break;}
    case "backupnow":try{t.disabled=true;await api("backupNow");toast("Backup saved on the server.");loadBackups();}catch(e){toast(e.message);}finally{t.disabled=false;}break;
    case "dlbackup":try{const {urls}=await api("signRead",{paths:[v]});if(urls[v])window.open(urls[v],"_blank","noopener");}catch(e){toast(e.message);}break;
    case "csv1":download("selaqui_point_status_"+dayKey(new Date().toISOString())+".csv",statusCSV());break;
    case "csv2":download("selaqui_full_log_"+dayKey(new Date().toISOString())+".csv",logCSV());break;
    case "json":download("selaqui_full_log_"+dayKey(new Date().toISOString())+".json",JSON.stringify({exportedAt:new Date().toISOString(),by:STATE.user,entries:D.all},null,1),"application/json");break;
  }
});
document.addEventListener("submit",ev=>{if(ev.target.id==="login-form"){ev.preventDefault();doLogin();}});
document.addEventListener("change",ev=>{
  const id=ev.target.id;
  if(id==="f-cat"){ui.cat=ev.target.value;renderRows();}
  else if(id==="f-status"){ui.st=ev.target.value;renderRows();}
  else if(id==="exp-st"){ui.expSt=ev.target.value;render();}
  else if(id==="ph-site"){ui.feedSite=ev.target.value;ui.photoN=60;render();}
  else if(id==="f-who"){ui.who=ev.target.value;renderRows();}
  else if(id==="fd-site"){ui.feedSite=ev.target.value;ui.feedN=60;render();}
  else if(id==="fd-kind"){ui.feedKind=ev.target.value;ui.feedN=60;render();}
  else if(id==="n-scope"){readDraft();draft.scope=ev.target.value;draft.item="";renderSheet();}
  else if(id==="n-item"){readDraft();draft.item=ev.target.value;}
  else if(id==="pick-cam"||id==="pick-gal"){const f=ev.target.files;addPhotos(f).finally(()=>{ev.target.value="";});}
});
let qT=null;
document.addEventListener("input",ev=>{
  if(ev.target.id==="l-name"&&draft){const x=peopleFor(draft.scope||"G").find(p=>p.d.name===ev.target.value);
    if(x){const m=$("#l-mob"),e=$("#l-mail");if(m&&!m.value)m.value=x.d.mobile||"";if(e&&!e.value)e.value=x.d.email||"";}}if(ev.target.id==="f-q"){ui.q=ev.target.value;clearTimeout(qT);qT=setTimeout(renderRows,150);}});
// hover tooltips for chart marks
const tip=$("#tip");
document.addEventListener("pointerover",ev=>{const t=ev.target.closest("[data-tip]");if(!t){tip.hidden=true;return;}tip.textContent=t.dataset.tip;tip.hidden=false;});
document.addEventListener("pointermove",ev=>{if(tip.hidden)return;const x=Math.min(ev.clientX+12,window.innerWidth-tip.offsetWidth-8);tip.style.left=Math.max(8,x)+"px";tip.style.top=(ev.clientY-tip.offsetHeight-12)+"px";});
document.addEventListener("scroll",()=>{tip.hidden=true;},{passive:true});
document.addEventListener("keydown",ev=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target||{}).tagName||"");
  if(ev.key==="Escape"){
    if(!$("#lightbox").hidden){$("#lightbox").hidden=true;$("#lightbox").innerHTML="";ev.preventDefault();return;}
    if(ui.sheet){requestClose();ev.preventDefault();return;}
  }
  if(ev.key==="/"&&!typing&&!ui.sheet&&STATE.token){
    ev.preventDefault();
    if(ui.tab!=="list"){ui.tab="list";lsSet("sa.tab","list");render();}
    const q=$("#f-q");if(q){q.focus();q.select();}
  }
});
window.addEventListener("popstate",()=>{if(ui.sheet&&!closeSheet())pushSheet();});
window.addEventListener("error",e=>{console.error(e.error||e.message);});
window.addEventListener("unhandledrejection",e=>{console.error(e.reason);});
setInterval(()=>{if(STATE.user&&STATE.token&&!document.hidden)renderTop();},30000);

/* ================= boot ================= */
(async function boot(){
  await loadLocal();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator&&location.protocol==="https:"){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
    // A new version took over: reload once to use it, unless a form is open (then the next open picks it up).
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!ui.sheet&&!STATE.syncing)location.reload();});
  }
  loadProf();
  loginWho=STATE.user;
  render();
  if(STATE.token){if(!isClient())startGeo();scheduleSync(50);setTimeout(()=>loadResources(true),1500);
    api("me").then(p=>{saveProf({username:p.username,name:p.name,role:p.role,perms:p.perms,accessUntil:p.accessUntil});render();}).catch(()=>{});}
})();
})();
</script>
</body>
