<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3F45">
<title>Selaqui Audit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#E9EFED; --ink:#14212B; --ink2:#3C4C55; --muted:#5E7079; --line:#D3DCD9;
  --head:#0E3F45; --head2:#11545B; --head-ink:#FFFFFF; --brand:#0E5A61; --brand-ink:#FFFFFF; --brand-soft:#DCEEEF;
  /* auditors (validated categorical pair) */
  --ajay:#2a78d6; --anis:#eb6834; --p3:#1baf7a; --p4:#eda100; --p5:#e87ba4;
  /* sites */
  --s0:#5B6B73; --s1:#1baf7a; --s2:#6250d6; --s3:#d4558a; --s4:#e09a00; --s5:#008300; --s6:#0d8aa0;
  /* status (reserved) */
  --good:#0ca30c; --info:#3567A6; --warn:#f2a900; --serious:#e5774b; --crit:#d03b3b; --neutral:#9A9A93;
  --grid:#e1e0d9;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1518; --surface:#162025; --surface2:#1E2C32; --ink:#E5EDEF; --ink2:#C3CED2; --muted:#94A6AD; --line:#2A3A41;
    --head:#0B2A2E; --head2:#0F3A40; --brand:#4DB7BF; --brand-ink:#06262A; --brand-soft:#173A3F;
    --ajay:#3987e5; --anis:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181;
    --s0:#8A9AA2; --s1:#199e70; --s2:#9085e9; --s3:#d55181; --s4:#c98500; --s5:#1f9a1f; --s6:#22a3b8;
    --info:#7FB0E6; --neutral:#7d7d76; --grid:#2c2c2a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1518; --surface:#162025; --surface2:#1E2C32; --ink:#E5EDEF; --ink2:#C3CED2; --muted:#94A6AD; --line:#2A3A41;
  --head:#0B2A2E; --head2:#0F3A40; --brand:#4DB7BF; --brand-ink:#06262A; --brand-soft:#173A3F;
  --ajay:#3987e5; --anis:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181;
  --s0:#8A9AA2; --s1:#199e70; --s2:#9085e9; --s3:#d55181; --s4:#c98500; --s5:#1f9a1f; --s6:#22a3b8;
  --info:#7FB0E6; --neutral:#7d7d76; --grid:#2c2c2a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
[hidden]{display:none!important}
#nl-badge-frame{display:none!important}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--head),var(--head2));color:var(--head-ink);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 9px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.app-title{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.app-title svg{flex:none}
.me{display:inline-flex;align-items:center;gap:7px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:3px 11px 3px 3px;font-weight:600;font-size:14px}
.sub-row{margin-top:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px}
.chip-h{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.chip-h i{width:8px;height:8px;border-radius:50%;background:#9aa;display:inline-block}
.chip-h.ok i{background:#6fe3a0}.chip-h.wait i{background:#ffc15a}.chip-h.bad i{background:#ff8d85}
.banner{background:#7a2a22;color:#fff;font-size:13px;padding:7px 14px}

/* avatars */
.av{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.av.sm{width:20px;height:20px;font-size:9.5px}
.av.lg{width:44px;height:44px;font-size:16px}
.av-ajay{background:var(--ajay)}.av-anis{background:var(--anis)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}

/* layout */
main{padding:12px 14px 0;max-width:760px;margin:0 auto}
.h-page{font-size:20px;font-weight:700;margin:4px 0 2px}
.sec-h{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:0 0 11px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-t{font-weight:700;font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* site accents */
.site-card{position:relative;overflow:hidden;padding-left:18px}
.site-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sc)}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--sc);color:#fff;font-weight:800;font-size:13px}
.badge.sm{min-width:20px;height:20px;font-size:11px;border-radius:6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border-radius:999px;padding:1px 9px 1px 7px;font-weight:600;background:color-mix(in srgb,var(--pc,var(--neutral)) 16%,transparent);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc,var(--neutral))}
.pill.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.pill.outline::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);white-space:nowrap}
.tag.mand{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 55%,transparent)}

/* progress strip + bars */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(8px,1fr));gap:2px;margin-top:10px}
.strip i{height:10px;border-radius:2px;display:block;background:var(--pc)}
.strip i.none{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.bar{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.bar.thick{height:18px}
.bar>span{display:block;height:100%;min-width:0}
.bar>span:first-child{border-radius:4px 0 0 4px}.bar>span:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--pc)}
.legend i.none{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.tile .v{font-size:28px;font-weight:700;line-height:1.1;margin-top:2px}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.hero{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:92px;height:92px}
.cb-ctls{display:flex;flex-direction:column;gap:6px}.cb-ctl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.cb-ctl::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cb-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 10px}.cb-sum div{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center}
.cb-sum b{display:block;font-size:20px}.cb-sum span{font-size:11px;color:var(--muted)}
.cb-wrap{overflow-x:auto;margin:0 -4px}.cb-t{border-collapse:separate;border-spacing:4px;width:100%;min-width:0}
.cb-t thead th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;white-space:nowrap}.cb-t thead th:first-child{text-align:left}
.cb-t tbody th{text-align:left;font-size:13px;font-weight:600;color:var(--ink2);min-width:120px;padding-right:4px}.cb-t tbody th .muted{margin-left:6px;font-size:11px}
.cb-t td{padding:0;min-width:58px}.cb-na{text-align:center;color:var(--muted)}
.cb-cell{position:relative;width:100%;height:46px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font:inherit;color:var(--ink);
  background:linear-gradient(to right,color-mix(in srgb,var(--fc) 30%,transparent) var(--pct),var(--surface) var(--pct));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cb-cell b{font-size:15px}.cb-cell b span{font-weight:500;color:var(--muted);font-size:12px}.cb-cell.sel{outline:2.5px solid var(--brand);outline-offset:1px}
.cb-r{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px var(--surface)}.cb-g{font-style:normal;font-size:10.5px;font-weight:700;color:var(--crit)}
.cb-left{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.cb-pts{display:grid;gap:6px;margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cb-pt{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:9px;background:var(--surface);padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer;min-width:0}
.cb-pt span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}.cb-pt i{font-style:normal;font-size:11px;font-weight:700;color:#14212B;border-radius:5px;padding:0 5px}
.cb-lsum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.tagm{font-style:normal;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:0 0 auto}
.tagm.m{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}.tagm.d{background:var(--surface2);color:var(--muted)}
.cb-pt .tagm{padding:1px 6px;font-size:10.5px}
.why-box{background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px;color:var(--ink2)}.why-box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--brand);margin-bottom:2px}
.xs-t{border-collapse:separate;border-spacing:3px;width:100%}.xs-t th{font-size:12px;text-align:left;font-weight:600;color:var(--ink2);padding-right:6px;min-width:150px}.xs-t thead th{text-align:center;min-width:0}
.xs-t td{text-align:center;min-width:40px}.xs-na{color:var(--muted);font-size:12px}.xs-b{width:100%;min-height:30px;border:0;border-radius:7px;background:color-mix(in srgb,var(--pc) 75%,transparent);color:#14212B;font:inherit;font-weight:700;cursor:pointer}
.dv{margin-top:12px}.dv-about{font-size:13px;color:var(--ink2);margin:8px 0 2px;display:grid;gap:3px}.dv-about b{color:var(--ink)}.dv-h{display:flex;gap:10px;align-items:flex-start}.dv-n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0 4px}
@media (max-width:520px){.cb-sum{grid-template-columns:repeat(3,1fr)}.cb-sum div:nth-child(n+4){display:none}}
.brow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm num" "bar bar";gap:5px 10px;align-items:center;padding:8px 0}
.brow .nm{grid-area:nm}.brow .bar{grid-area:bar}.brow .num{grid-area:num}
@media (min-width:600px){.brow{grid-template-columns:minmax(150px,30%) 1fr auto;grid-template-areas:"nm bar num"}}
.brow+.brow{border-top:1px solid var(--line)}
.brow .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.brow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .num{font-size:12.5px;color:var(--ink2);text-align:right;min-width:52px}
.aud-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.aud-grid{grid-template-columns:1fr 1fr}}
.aud{border-top:5px solid var(--ac)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--surface2);border-radius:10px;padding:7px 9px}
.kv b{display:block;font-size:19px}
.kv span{font-size:11.5px;color:var(--muted);font-weight:600}
.cols{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;min-width:0;position:relative}
.col span{display:block;width:100%;max-width:38px;margin:0 auto}
.col span:first-child{border-radius:4px 4px 0 0}
.col .cv{font-size:11.5px;color:var(--ink2);text-align:center}
.xl{display:flex;gap:8px;margin-top:4px}.xl div{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.gap-li{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.gap-li:first-child{border-top:0}

/* checklist */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 8px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--sc);color:#fff;border-color:var(--sc)}
.chip.on .badge{background:rgba(255,255,255,.25)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13.5px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.opt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc,transparent);box-shadow:inset 0 0 0 1.5px var(--pc,var(--muted))}
.opt.plain::before{display:none}
.opt.on{background:color-mix(in srgb,var(--pc,var(--brand)) 20%,var(--surface));border-color:var(--pc,var(--brand));box-shadow:inset 0 0 0 1px var(--pc,var(--brand))}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.filters select{padding:9px 8px;font-size:14px}
.qf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.qf-l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;min-width:62px}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.qchip b{font-weight:700;color:var(--muted);margin-left:2px}
.qchip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.qchip.on b{color:inherit;opacity:.85}
input[type=date]{display:block;min-height:46px}
input[type=text],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;font-size:16px}
textarea{min-height:92px;resize:vertical}
.cat-h{font-weight:700;font-size:13.5px;margin:16px 0 6px;color:var(--brand);display:flex;justify-content:space-between}
.row{display:flex;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc,var(--line));border-radius:12px;padding:10px 11px;margin:0 0 7px}
.rbody{display:block;min-width:0;flex:1}
.tick{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);margin-top:1px;position:relative}
.tick.on{background:var(--good);box-shadow:none}
.tick.on::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.row.done{background:color-mix(in srgb,var(--good) 5%,var(--surface))}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:600px){.gal{grid-template-columns:repeat(4,1fr)}}
.gi{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);text-align:left;border-bottom:3px solid var(--ac)}
.gi img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface2)}
.gc{display:flex;gap:5px;align-items:flex-start;padding:5px 6px;font-size:11px;line-height:1.3;color:var(--ink2)}
.lb-info{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 11px;font-size:13px;max-width:560px;width:100%}
.lb-info a{color:#9fd6ff}
.lb-btns{display:flex;gap:10px}
.lb-btns .btn{background:#fff;color:#0E3F45;border:0}
.rtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.rtxt{display:block;margin-top:3px;font-size:14.5px}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* entries */
.ent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 9px;border-left:4px solid var(--ac)}
.ent.withdrawn{opacity:.55}
.ent-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.ent-h b{font-size:14px}
.ent-b{margin-top:6px;white-space:pre-wrap;word-break:break-word}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.nogps{color:var(--serious)}
.stampbox{margin-top:8px;background:var(--surface2);border-radius:9px;padding:6px 9px;font-size:12px;display:grid;gap:2px}
.stampbox div{display:grid;grid-template-columns:86px 1fr;gap:6px}
.stampbox span{color:var(--muted)}
.stampbox b{font-weight:600;overflow-wrap:anywhere}
.rec-box{margin-top:8px;font-size:13.5px;background:color-mix(in srgb,var(--good) 10%,var(--surface));border-left:3px solid var(--good);border-radius:8px;padding:7px 10px;white-space:pre-wrap}
.rec-box span{display:block;font-size:11.5px;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.4px}
.later-box{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13.5px}
.res-for{margin-top:8px;font-size:13.5px;background:var(--brand-soft);border-radius:9px;padding:7px 10px}

function siteMapHTML(g,W,H){
  if(!g||!g.poly||g.poly.length<3)return "";

  const lat0=g.poly.reduce((a,p)=>a+p[0],0)/g.poly.length,mlat=111320,mlng=111320*Math.cos(lat0*Math.PI/180);
  let area=0,per=0;const xy=g.poly.map(p=>[(p[1]-g.poly[0][1])*mlng,(p[0]-g.poly[0][0])*mlat]);
  for(let i=0;i<xy.length;i++){const a=xy[i],b=xy[(i+1)%xy.length];area+=a[0]*b[1]-b[0]*a[1];per+=Math.hypot(b[0]-a[0],b[1]-a[1]);}
  area=Math.abs(area)/2;
  const wx=(lng,z)=>(lng+180)/360*256*Math.pow(2,z),wy=(lat,z)=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*Math.pow(2,z);};

/* ================= local storage (IndexedDB) ================= */
// entries: synced copy from the server; outbox: entries not yet on the server; blobs: photos not yet uploaded.
let idb=null;
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function openDB(){return new Promise(res=>{try{const rq=indexedDB.open("selaqui-audit-v2",1);
  rq.onupgradeneeded=()=>{const d=rq.result;d.createObjectStore("entries",{keyPath:"id"});d.createObjectStore("outbox",{keyPath:"id"});d.createObjectStore("blobs");d.createObjectStore("meta");};
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null);}catch(e){res(null);}});}
const tx=(n,m)=>idb.transaction(n,m).objectStore(n);
async function dbAll(n){if(!idb)return [];try{return await reqP(tx(n,"readonly").getAll());}catch(e){return [];}}
async function dbPut(n,v,k){if(!idb)return;try{await reqP(k===undefined?tx(n,"readwrite").put(v):tx(n,"readwrite").put(v,k));}catch(e){storageWarn(e);}}
async function dbGet(n,k){if(!idb)return null;try{return await reqP(tx(n,"readonly").get(k));}catch(e){return null;}}
async function dbDel(n,k){if(!idb)return;try{await reqP(tx(n,"readwrite").delete(k));}catch(e){}}
async function dbPutMany(n,arr){if(!idb||!arr.length)return;await new Promise(res=>{try{const t=idb.transaction(n,"readwrite"),s=t.objectStore(n);arr.forEach(v=>s.put(v));t.oncomplete=res;t.onerror=()=>res();t.onabort=()=>res();}catch(e){res();}});}
function storageWarn(e){if(e&&e.name==="QuotaExceededError")showBanner("Phone storage is full. Sync now and free some space on the phone.");}
function showBanner(t){const b=$("#banner");b.textContent=t||"";b.hidden=!t;}

  online:navigator.onLine,syncing:false,lastSync:0,syncErr:"",ver:0};
const blobUrls=new Map();       // path -> object URL for photos still on this phone
const signed=new Map();         // path -> {url,exp}
async function loadLocal(){
  idb=await openDB();
  if(!idb)showBanner("Offline storage is unavailable in this browser. Keep the signal on so entries reach the server.");
  for(const e of await dbAll("entries"))STATE.synced.set(e.id,e);
  for(const e of await dbAll("outbox"))STATE.outbox.set(e.id,e);
  STATE.lastSeq=Number(await dbGet("meta","lastSeq"))||0;
  for(const e of STATE.synced.values())if(e.seq>STATE.lastSeq)STATE.lastSeq=e.seq;
}

/* ================= API + sync ================= */
async function api(action,body,opts){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),(opts&&opts.timeout)||25000);
  try{
    const L=GEO.last,geo=L&&Date.now()-L.t<600000?{lat:L.lat,lng:L.lng,acc:L.acc,stale:Date.now()-L.t>60000}:null;
    const r=await fetch(API,{method:"POST",signal:ctl.signal,headers:Object.assign({"content-type":"application/json"},STATE.token?{authorization:"Bearer "+STATE.token}:{}),body:JSON.stringify(Object.assign({action,geo},body||{}))});
    const j=await r.json().catch(()=>({error:"Bad response ("+r.status+")"}));
    if(r.status===401&&action!=="login"){signOut(true);}
    else if(r.status===403&&action!=="login"&&/access .*has ended/i.test(j.error||"")){signOut(true,j.error);}
    if(!r.ok){const er=new Error(j.error||("Error "+r.status));er.status=r.status;throw er;}
    return j;
  }finally{clearTimeout(to);}
}
let syncTimer=null,syncAgain=false;
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(sync,ms==null?400:ms);}
async function sync(){
  if(!STATE.token)return;
  if(STATE.syncing){syncAgain=true;return;}
  STATE.syncing=true;renderTop();
  let changed=false;
  try{
    // 1. upload pending photos and entries, oldest first
    // Only this user's entries: the server stamps the signed-in user as author.
    const pending=Array.from(STATE.outbox.values()).filter(e=>e.author===STATE.user&&!e.rejected).sort((a,b)=>a.ts<b.ts?-1:1);
    for(const e of pending){
     try{
      const paths=[];for(const p of e.photos||[])paths.push(p.p,p.t);
      const need=[];for(const p of paths){if(await dbGet("blobs",p))need.push(p);}
      if(need.length){
        const {uploads}=await api("signUpload",{paths:need});
        for(const u of uploads){
          const blob=await dbGet("blobs",u.path);if(!blob)continue;
          const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);
          try{
            const r=await fetch(u.url,{method:"PUT",headers:{"content-type":"image/jpeg","x-upsert":"true"},body:blob,signal:ctl.signal});
            if(!r.ok)throw new Error("Photo upload failed ("+r.status+")");
          }finally{clearTimeout(to);}
          await dbDel("blobs",u.path);
        }
      }
      const out=Object.assign({},e);delete out.local;delete out.rejected;
      await api("push",{entries:[out]});
      STATE.outbox.delete(e.id);await dbDel("outbox",e.id);
      STATE.synced.set(e.id,Object.assign({},e,{seq:0}));
      changed=true;
     }catch(err){
      // A 4xx (other than auth) means the server will never accept this entry; park it so the queue keeps moving.
      if(err.status>=400&&err.status<500&&err.status!==401&&err.status!==429){e.rejected=err.message;await dbPut("outbox",e);changed=true;continue;}
      throw err;
     }
    }
    // 2. pull everything newer than what this phone has
    for(let guard=0;guard<20;guard++){
      let r=await api("pull",{since:STATE.lastSeq});
      // The server's epoch changes when the log is reset; drop this phone's cached copy (never the unsent outbox).
      const ep=await dbGet("meta","epoch");
      if(r.epoch&&ep!==r.epoch){
        if(STATE.synced.size||STATE.lastSeq){STATE.synced.clear();STATE.lastSeq=0;if(idb){try{await reqP(tx("entries","readwrite").clear());}catch(e){}}changed=true;r=await api("pull",{since:0});}
        await dbPut("meta",r.epoch,"epoch");
      }
      if(r.entries.length){
        r.entries.forEach(e=>{STATE.synced.set(e.id,e);if(e.seq>STATE.lastSeq)STATE.lastSeq=e.seq;});
        await dbPutMany("entries",r.entries);await dbPut("meta",STATE.lastSeq,"lastSeq");changed=true;
      }
      if(!r.more)break;
    }
    STATE.lastSync=Date.now();STATE.syncErr="";
  }catch(err){
    STATE.syncErr=navigator.onLine?(err.name==="AbortError"?"Slow network, will retry":err.message):"Offline";
  }finally{
    STATE.syncing=false;
    if(changed){STATE.ver++;render();}else renderTop();
    if(syncAgain){syncAgain=false;scheduleSync(300);}
    else scheduleSync(STATE.outbox.size?(STATE.syncErr?20000:2000):(document.hidden?120000:20000));
  }
}
window.addEventListener("online",()=>{STATE.online=true;scheduleSync(200);});
window.addEventListener("offline",()=>{STATE.online=false;renderTop();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)scheduleSync(300);});

/* ================= photo pipeline ================= */
// Decode one image at a time and downscale, so low-memory phones do not crash on 12 MP photos.
async function decode(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){try{return await createImageBitmap(file);}catch(e2){}}}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Cannot read this image"));};im.src=u;});
}
function toJpeg(src,w0,h0,max,q){
  const s=Math.min(1,max/Math.max(w0,h0));const w=Math.round(w0*s),h=Math.round(h0*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(src,0,0,w,h);
  return new Promise(res=>c.toBlob(b=>{c.width=c.height=0;res({blob:b,w,h});},"image/jpeg",q));
}
async function compress(file){
  const img=await decode(file);
  const w0=img.width||img.naturalWidth,h0=img.height||img.naturalHeight;
  try{
    const full=await toJpeg(img,w0,h0,1600,0.74);
    const thumb=await toJpeg(img,w0,h0,360,0.62);
    if(!full.blob||!thumb.blob)throw new Error("Could not compress photo");
    return {full,thumb};
  }finally{if(img.close)img.close();if(img.src&&img.src.startsWith("blob:"))URL.revokeObjectURL(img.src);}
}

/* thumbnails: local blobs first, else signed URLs fetched in batches as they scroll into view */
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){io.unobserve(en.target);queueThumb(en.target);}});},{rootMargin:"200px"}):null;
let thumbQ=[],thumbT=null;
function queueThumb(img){thumbQ.push(img);clearTimeout(thumbT);thumbT=setTimeout(flushThumbs,60);}
async function urlFor(path){
  if(blobUrls.has(path))return blobUrls.get(path);
  const b=await dbGet("blobs",path);if(b){const u=URL.createObjectURL(b);blobUrls.set(path,u);return u;}
  const s=signed.get(path);if(s&&s.exp>Date.now())return s.url;
  return null;
}
async function flushThumbs(){
  const imgs=thumbQ.splice(0);const need=[];
  for(const im of imgs){const u=await urlFor(im.dataset.p);if(u)im.src=u;else need.push(im);}
  if(!need.length||!STATE.token)return;
  try{
    const paths=Array.from(new Set(need.map(i=>i.dataset.p))).slice(0,200);
    const {urls}=await api("signRead",{paths});
    for(const p in urls)signed.set(p,{url:urls[p],exp:Date.now()+5*3600e3});
    need.forEach(im=>{const s=signed.get(im.dataset.p);if(s)im.src=s.url;});
  }catch(e){}
}
function hydrateThumbs(root){$$("img[data-p]",root).forEach(im=>{if(im.src)return;if(io)io.observe(im);else queueThumb(im);});}
function thumbsHTML(photos,localTag){
  if(!photos||!photos.length)return "";
  return '<div class="thumbs">'+photos.map(p=>'<button type="button" data-act="zoom" data-v="'+esc(p.p)+'" aria-label="Open photo '+esc(photoRef(p.p))+'"><img data-p="'+esc(p.t)+'" alt="" loading="lazy">'+(localTag?'<span class="up">on phone</span>':'')+'<span class="pref">'+esc(photoRef(p.p))+'</span></button>').join("")+'</div>';
}

/* ================= geolocation ================= */
const GEO={last:null,watch:null,state:"idle"};
function startGeo(force){
  if(!navigator.geolocation){GEO.state="unsupported";renderTop();return;}
  if(GEO.watch!=null&&!force)return;
  if(GEO.watch!=null){try{navigator.geolocation.clearWatch(GEO.watch);}catch(e){}GEO.watch=null;}
  GEO.state="wait";renderTop();
  try{GEO.watch=navigator.geolocation.watchPosition(
    p=>{GEO.last={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};if(GEO.state!=="ok"){GEO.state="ok";renderTop();}},
    e=>{GEO.state=e.code===1?"denied":"wait";renderTop();},
    {enableHighAccuracy:true,maximumAge:5000,timeout:25000});}catch(e){GEO.state="unsupported";renderTop();}
}
function stamp(){
  return new Promise(res=>{
    const ts=new Date().toISOString(),L=GEO.last;
    if(L&&Date.now()-L.t<60000)return res({ts,geo:{lat:L.lat,lng:L.lng,acc:L.acc},gerr:""});
    if(!navigator.geolocation)return res({ts,geo:null,gerr:"not supported"});
    let done=false;
    const fin=(geo,err)=>{if(done)return;done=true;if(!geo&&L&&Date.now()-L.t<600000)geo={lat:L.lat,lng:L.lng,acc:L.acc,stale:true};res({ts,geo:geo||null,gerr:geo?"":err});};
    try{navigator.geolocation.getCurrentPosition(p=>{GEO.last={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy},"");},e=>fin(null,e.code===1?"permission blocked":"no fix"),{enableHighAccuracy:true,timeout:6000,maximumAge:10000});}catch(e){fin(null,"error");}
    setTimeout(()=>fin(null,"timed out"),6500);
  });
}

/* ================= derived model ================= */
let D=null,Dver=-1;
function derive(){
  if(Dver===STATE.ver&&D)return D;
  const all=[];
  for(const e of STATE.synced.values())all.push(e);
  for(const e of STATE.outbox.values())if(!STATE.synced.has(e.id))all.push(Object.assign({local:true},e));
  all.sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:(a.id<b.id?-1:1));
  const withdrawn=new Set(all.filter(e=>e.kind==="retract").map(e=>e.target));
  let live=all.filter(e=>e.kind!=="retract"&&!withdrawn.has(e.id));
  // An edit (new version) or an add (more photos) points at its observation; drop them if that observation was withdrawn.
  const liveIds=new Set(live.map(e=>e.id));
  live=live.filter(e=>!isChild(e)||liveIds.has(e.target));
  const kids=new Map();
  for(const e of live)if(isChild(e))(kids.get(e.target)||kids.set(e.target,[]).get(e.target)).push(e);
  // Photo reference numbers: per site and point in upload order (server sequence), e.g. S1-AD-01-P03; bills EXP-P01.
  const refs=new Map(),cnt={};
  for(const e of all.filter(x=>x.kind!=="retract"&&(x.photos||[]).length).sort((a,b)=>((a.seq||1e15)-(b.seq||1e15))||(a.ts<b.ts?-1:1))){
    const g=e.kind==="expense"?"EXP":(e.scope==="G"?"C":e.scope&&SITE[e.scope]?"S"+SITE[e.scope].no:"X")+"-"+(e.item||"NOTE");
    e.photos.forEach(ph=>{cnt[g]=(cnt[g]||0)+1;const r=g+"-P"+pad(cnt[g]);refs.set(ph.p,r);refs.set(ph.t,r);});
  }
  const pts=new Map(),visits={};
  for(const e of live){
    if(e.kind==="visit"){(visits[e.scope]=visits[e.scope]||[]).push(e);continue;}
    if(!e.item||!e.scope)continue;
    const k=e.scope+"|"+e.item;let p=pts.get(k);
    if(!p){p={entries:[],status:null,statusBy:null,firstBy:null,authors:new Set(),photos:0,sev:null};pts.set(k,p);}
    p.entries.push(e);p.authors.add(e.author);p.photos+=(e.photos||[]).length;
    if(e.status){p.status=e.status;p.statusBy=e.author;if(!p.firstBy&&!IN_PROGRESS.has(e.status))p.firstBy=e.author;}
    if(e.sev&&e.sev!=="info"&&e.sev!=="good")p.sev=e.sev;
  }
  const exp=[],claims=new Map();
  for(const e of live){
    if(e.kind==="claim"){(claims.get(e.target)||claims.set(e.target,[]).get(e.target)).push(e);}
  }
  for(const e of live){
    if(e.kind!=="expense")continue;
    let d={};try{d=JSON.parse(e.body||"{}");}catch(x){}
    const hist=claims.get(e.id)||[];const last=hist[hist.length-1];
    exp.push({e,d,amount:Number(d.amount)||0,status:last?last.status:"draft",statusBy:last?last.author:e.author,statusAt:last?last.ts:e.ts,hist});
  }
  exp.reverse();
  // Auditees: a person record replaced by a later one (target) or marked removed drops out.
  const replaced=new Set(live.filter(e=>e.kind==="person"&&e.target).map(e=>e.target));
  const people={};
  for(const e of live){
    if(e.kind!=="person"||replaced.has(e.id))continue;
    let d={};try{d=JSON.parse(e.body||"{}");}catch(x){}
    if(d.removed)continue;
    (people[e.scope||"G"]=people[e.scope||"G"]||[]).push({e,d});
  }
  for(const k in people)people[k].sort((a,b)=>(a.d.func||"").localeCompare(b.d.func||"")||(a.d.name||"").localeCompare(b.d.name||""));
  D={all,live,withdrawn,pts,visits,exp,people,kids,refs};
  D.obs=live.filter(e=>isAudit(e)&&!isChild(e)).map(effObs);
  // A photo-only entry (no text, rating or status) belongs with the written observation for the same point: documents show its photos there.
  for(const po of D.obs){if(!po.item||(po.body||"").trim()||po.sev||po.status||!(po.photos||[]).length)continue;
    const sib=D.obs.filter(o=>o!==po&&o.scope===po.scope&&o.item===po.item&&(o.body||"").trim());if(!sib.length)continue;
    const t=sib.find(o=>/photo/i.test(o.body)&&!(o.photos||[]).length)||sib.find(o=>/photo/i.test(o.body))||sib[0];
    t.linked=(t.linked||[]).concat(po.photos);po.mergedInto=t.id;}
  const SR={high:3,med:2,low:1};for(const p of pts.values()){p.sev=null;p.risk=0;p.trisk=0;p.rx=null;}
  for(const o of D.obs){const p=o.item&&o.scope?pts.get(o.scope+"|"+o.item):null;if(!p)continue;
    if(SR[o.sev]&&(!p.sev||SR[o.sev]>SR[p.sev]))p.sev=o.sev;
    const x=o.extra;if(x&&x.li&&x.im&&x.li*x.im>p.risk){p.risk=x.li*x.im;p.rx=x;p.trisk=x.tli&&x.tim?x.tli*x.tim:0;}}
  Dver=STATE.ver;return D;
}
// "covered" = a final status is recorded; "progress" = entries exist but nothing final yet.
function stateOf(p){if(!p)return "none";if(p.status&&!IN_PROGRESS.has(p.status))return "covered";return "progress";}
// State of a point at a site: desirable points left unlogged at a site whose audit is done are "not assessed" (time constraint), not open.
function ptState(sc,it){const s=stateOf(D.pts.get(pkey(sc,it)));return s==="none"&&!it.mand&&RES&&RES.sites&&(RES.sites.find(x=>x.site===sc)||{}).status==="done"?"na":s;}
const STATE_COL={covered:"good",progress:"warn",none:null};
function pointColor(p){if(!p)return null;if(p.status)return ST[p.status].col;return "warn";}
function scopeStats(scope,sec){
  const its=viewItems(scope,sec);const r={total:its.length,covered:0,progress:0,none:0,na:0,gaps:0,findings:0,cells:[]};
  for(const it of its){const p=D.pts.get(pkey(scope,it));const s=ptState(scope,it);r[s]++;if(s==="na"){r.total--;continue;}
    if(p&&(p.status==="notavail"||p.status==="noncomp"))r.gaps++;
    r.cells.push(pointColor(p));}
  return r;
}
function totals(){
  const r={total:0,covered:0,progress:0,none:0,na:0};
  for(const [sc,it] of ALL_POINTS){const s=ptState(sc,it);r[s]++;if(s!=="na")r.total++;}
  return r;
}

// Same checklist point across all sites: current risk side by side, to check that like findings carry like ratings.
function crossRows(min){
  return ITEMS.filter(it=>SITES.some(s=>itemsFor(s.id).includes(it))).map(it=>({it,c:SITES.map(s=>{const p=D.pts.get(pkey(s.id,it)),st=itemsFor(s.id).includes(it)?ptState(s.id,it):"x";return {sc:s.id,p,st,r:p?p.risk||0:0};})}))
    .filter(row=>row.c.some(c=>c.r>=min));
}
function crossCell(c,html){
  if(c.st==="x")return '<td class="xs-na">·</td>';
  if(c.r){const b=riskBand(c.r);return html?'<td class="r-'+b[1]+' xs-c"><b>'+c.r+'</b></td>':'<td><button type="button" class="xs-b" style="--pc:var(--'+b[1]+')" data-act="open" data-v="'+c.p.entries[0].item+'" data-s="'+c.sc+'" title="'+b[0]+'">'+c.r+'</button></td>';}
  const t=c.st==="na"?"n/a":c.p&&c.p.status==="notapp"?"N/A":c.p&&c.p.status==="notavail"?"✗":c.p?"✓":"-";return '<td class="xs-na">'+t+'</td>';
}

function audStats(u){
  const r={entries:0,points:new Set(),covered:0,photos:0,findings:{high:0,med:0,low:0},last:null,bySite:{},days:{}};
  for(const e of D.live){if(e.author!==u||!isAudit(e))continue;
    r.entries++;r.photos+=(e.photos||[]).length;if(e.item)r.points.add(e.scope+"|"+e.item);
    if(e.sev&&r.findings[e.sev]!=null)r.findings[e.sev]++;
    if(!r.last||e.ts>r.last)r.last=e.ts;
    const s=e.scope||"G";r.bySite[s]=(r.bySite[s]||0)+1;
    const dk=dayKey(e.ts);r.days[dk]=(r.days[dk]||0)+1;}
  for(const p of D.pts.values())if(p.firstBy===u&&stateOf(p)==="covered")r.covered++;
  return r;
}

// Text the search box looks through: the point itself plus everything entered against it.
function haystack(it,p){
  let h=(it.id+" "+it.text+" "+it.cat+" "+(it.mand?"mandatory":"desirable")+" "+it.when).toLowerCase();
  if(p){
    h+=" "+(p.status?ST[p.status].label:"notes only");
    for(const e of p.entries)h+=" "+[(e.photos||[]).map(x=>photoRef(x.p)).join(" "),e.body,e.extra&&e.extra.rec,e.extra&&(e.extra.sop||[]).join(" "),e.by,e.ref,(e.evid||[]).join(" "),e.status&&ST[e.status]?ST[e.status].label:"",e.sev&&SEVM[e.sev]?SEVM[e.sev].label:"",uname(e.author)].join(" ").toLowerCase();
  }else h+=" not covered";
  return h;
}
// How many points in the current site/section each quick filter would show (respecting the other quick filter).
// One test for every checklist filter; o overrides a filter so each button can show what it would list.
function rowPass(it,o){
  const f=Object.assign({pri:ui.pri,when:ui.when,filter:ui.filter},o||{});
  const sc=ui.scope,q=ui.q.trim().toLowerCase(),p=D.pts.get(pkey(sc,it)),s=ptState(sc,it);
  if(ui.cat!=="all"&&it.cat!==ui.cat)return false;
  if(f.pri!=="all"&&(it.mand?"M":"D")!==f.pri)return false;
  if(f.when!=="all"&&it.when!==f.when)return false;
  if(ui.who!=="all"&&!(p&&p.authors.has(ui.who)))return false;
  if(ui.st==="none"&&p)return false;
  if(ui.st==="notes"&&!(p&&!p.status))return false;
  if(ui.st!=="all"&&ui.st!=="none"&&ui.st!=="notes"&&!(p&&p.status===ui.st))return false;
  if(f.filter==="gaps"){if(!(p&&(p.status==="notavail"||p.status==="noncomp")))return false;}
  else if(f.filter!=="all"&&s!==f.filter)return false;
  if(q&&!q.split(/\s+/).every(w=>haystack(it,p).includes(w)))return false;
  return true;
}
function qcount(kind,v){const o={};o[kind]=v;return viewItems(ui.scope,ui.sec).filter(it=>rowPass(it,o)).length;}

function pendingGroups(onlyScope){
  const g=new Map();
  for(const [sc,it] of ALL_POINTS){
    if(onlyScope&&sc!==onlyScope)continue;
    const p=D.pts.get(sc+"|"+it.id);if(!p||p.status!=="later")continue;

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipBlob(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  for(const f of files){const nm=enc.encode(f.name),c=crc32(f.data),n=f.data.length;
    const h=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,dt,2],[12,dd,2],[14,c,4],[18,n,4],[22,n,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,l])=>l===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    parts.push(h.buffer,nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,dt,2],[14,dd,2],[16,c,4],[20,n,4],[24,n,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,l])=>l===4?ch.setUint32(o,v,true):ch.setUint16(o,v,true));
    cen.push(ch.buffer,nm);off+=30+nm.length+n;}
  const cs=cen.reduce((a,b)=>a+b.byteLength,0),e=new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,files.length,2],[10,files.length,2],[12,cs,4],[16,off,4],[20,0,2]].forEach(([o,v,l])=>l===4?e.setUint32(o,v,true):e.setUint16(o,v,true));

}

async function photosZip(list,fname){

  const wx=(lng,z)=>(lng+180)/360*256*Math.pow(2,z),wy=(lat,z)=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*Math.pow(2,z);};
  let z=18;while(z>10&&((wx(Math.max(...lngs),z)-wx(Math.min(...lngs),z))>W*0.92||(wy(Math.min(...lats),z)-wy(Math.max(...lats),z))>H*0.86))z--;
  const cx=(wx(Math.max(...lngs),z)+wx(Math.min(...lngs),z))/2,cy=(wy(Math.min(...lats),z)+wy(Math.max(...lats),z))/2,x0=cx-W/2,y0=cy-H/2;
  let tiles="";
  for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+W)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+H)/256);ty++)
    tiles+=tileImg(z,tx,ty,x0,y0,W,H);
  const COL={s1:"#1baf7a",s2:"#9085e9",s3:"#d4558a",s4:"#e09a00",s5:"#21b021",s6:"#22a3b8"};
  const shapes=list.map(x=>{const P=x.g.poly.map(p=>[wx(p[1],z)-x0,wy(p[0],z)-y0]);const c=P.reduce((a,p)=>[a[0]+p[0]/P.length,a[1]+p[1]/P.length],[0,0]);const on=!hl||hl===x.s.id;
    return '<polygon points="'+P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="'+COL[x.s.id]+(on?"55":"22")+'" stroke="'+COL[x.s.id]+'" stroke-width="'+(on?3:2)+'"/>'+

   '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:100%">'+shapes+'</svg><div style="position:absolute;right:4px;bottom:2px;font-size:9px;color:#fff;text-shadow:0 0 3px #000">Imagery © Esri, Maxar · perimeters from KML</div></div>'+
   '<div class="muted" style="margin-top:4px">Marked: '+list.map(x=>x.s.no+". "+esc(x.s.name)).join(" · ")+(dist.length?' · straight-line distance '+dist.join(", "):'')+'.'+(SITES.some(s=>!list.some(x=>x.s.id===s.id))?' Sites not yet marked: '+SITES.filter(s=>!list.some(x=>x.s.id===s.id)).map(s=>s.no+". "+esc(s.name)).join(", ")+'.':'')+'</div>';

    b+='<section class="pb"><h2>5. Critical assets and security zoning</h2><table><tr><th>Zone</th><th>Areas at this site</th><th>Who may enter</th><th>Minimum controls</th></tr>'+
     [["Zone 0 - Public / approach","Approach road, parking outside the gate","Anyone","CCTV on approach and gate, lighting, no parking against the boundary wall"],
      ["Zone 1 - Controlled (inside the boundary)","Security office, open yard, canteen, offices","Employees, contract workers, escorted visitors","Gate ID check, visitor registration, vehicle checks, perimeter barrier and patrols"],
      ["Zone 2 - Restricted (operations)","Production floors (ground-floor machine lines, first-floor manual production), stores, dispatch, maintenance","Staff assigned to the area","Card / face access with anti-tailgating, CCTV on entries, frisking at production exits, mobile / media rules"],
      ["Zone 3 - High security","Server / CCTV room, HV panel room, transformer and DG yard, HSD storage, high-value store, customer-confidential areas","Named authorised persons only","Access list on the door, card / face access or key with register, CCTV, alarms, fire suppression where needed"]].map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i?esc(c):'<b>'+esc(c)+'</b>')+'</td>').join("")+'</tr>').join("")+'</table>'+
     '<h3>Status of zone controls at this site</h3>'+obsLine(sd,["AD-31","AD-07","W-02","W-07","W-10"])+'</section>';
    b+='<section class="pb"><h2>6. Security organisation and deployment</h2>'+obsLine(sd,["AD-08","AD-13","AD-17","AD-18","AD-19","AD-12"])+
     '<h3>Required arrangement</h3><ul><li>Security In-charge (on-roll) accountable to the Plant Head, with a nominated trained deputy.</li><li>Security agency (PSARA-licensed) supervisor per shift; post-wise deployment chart signed daily (sanctioned vs actual, incl. female guards).</li><li>Posts: main gate (people), material / vehicle gate, production exit frisking, patrol, CCTV monitoring, as per the deployment chart.</li><li>Signed, version-controlled post orders at every post; guards trained and assessed on them.</li></ul></section>';
    b+='<section class="pb"><h2>7. Physical and electronic security measures</h2><table><tr><th>Area</th><th>Status</th><th>Observed</th></tr>'+itemsFor(sc,"walk").map(it=>'<tr><td><b>'+it.id+'</b> '+esc(it.area)+'</td><td>'+esc(st(it.id))+'</td><td>'+findBody(sd,it.id).map(esc).join("<br>")+'</td></tr>').join("")+'</table>'+
     '<h3>Technology</h3>'+obsLine(sd,["AD-35","AD-36","AD-38","AD-32","AD-64","AD-66"])+'</section>';
    b+='<section class="pb"><h2>8. Security procedures</h2><p>The site follows the Corporate-Level Security SOP Set (Deliverable 5). Site-specific details (post names, phone numbers, zone list) are added as annexures. Current status:</p><table><tr><th>Area</th><th>Status at this site</th></tr>'+
     [["Policy and security manual",["AD-09","AD-10","AD-11"]],["Visitor and contractor",["AD-40","AD-41"]],["Material, vehicle and dispatch",["AD-42","AD-44","AD-45","AD-46"]],["Key control",["AD-34"]],["CCTV",["AD-37"]],["Frisking",["AD-51"]],["Incidents",["AD-15","AD-53","AD-54"]]].map(([l,ids])=>'<tr><td>'+l+'</td><td>'+ids.map(id=>'<b>'+id+'</b> '+esc(st(id))).join(" · ")+'</td></tr>').join("")+'</table></section>';
    b+='<section class="pb"><h2>9. Emergency and incident response</h2>'+obsLine(sd,["AD-55","AD-56","AD-57","AD-58","AD-62","W-09"])+
     '<h3>Scenarios to be covered</h3><ul><li>Fire and evacuation (escape doors must release on alarm and power failure).</li><li>Intrusion, theft in progress, bomb threat, sabotage of utilities.</li><li>Labour unrest, gate blockade, road blockade on the access road.</li><li>Flood / water-logging and earthquake (see context).</li><li>Medical emergency and road accident near the gate.</li></ul></section>';
    const prio=sd.findings.map(e=>({e,b:riskBand(sd.rs(e))[0]}));
    b+='<section class="pb"><h2>10. Implementation plan</h2><p>Actions come from the Operational Requirement for this site (Deliverable 4). Timelines follow the risk band.</p><table><tr><th>Band</th><th>Timeline</th><th>Actions</th></tr>'+["Critical","High","Medium","Low"].map(bd=>{const xs=prio.filter(x=>x.b===bd);return xs.length?'<tr><td class="r-'+BAND_DEF.find(r=>r[0]===bd)[2]+'"><b>'+bd+'</b></td><td>'+BAND_TIME[bd]+'</td><td><ul>'+xs.map(x=>'<li><b>'+esc(x.e.item||"Other")+':</b> '+esc(x.e.extra.rec||"")+'</li>').join("")+'</ul></td></tr>':'';}).join("")+'</table>'+
     '<h2>11. Review and maintenance</h2><ul><li>Monthly security review by the Plant Head: incidents, open actions, deployment, system health.</li><li>Quarterly access-list review and key audit.</li><li>Annual review of this plan and of the risk assessment, or sooner after a significant incident or change.</li></ul></section>';
    return b;});
}
function makeOR(sc){
  const S=SITE[sc];
  return openDoc(pdfName(4,"Operational Requirement",sc),()=>{
    const sd=siteData(sc);
    let b=docCover("Operational Requirement (OR)",esc(S.no+". "+S.name),siteHeader(sc),sc);
    b+='<section class="pb"><h2>1. Purpose</h2><p>This Operational Requirement states what the site needs its security measures to achieve, in terms that can be designed, procured and tested. Each requirement comes from an audit finding, carries the current and target risk, an owner, a timeline by risk band and acceptance criteria. Technical specifications (camera models, reader types) are left to the design stage; the OR fixes the outcome to be achieved.</p>'+
     '<h2>2. Operational context</h2><ul><li>'+esc(S.name)+' runs shift-based production with a large contract workforce; peak gate load is at shift change.</li><li>Material of high value (components, finished goods) moves through stores, production and dispatch daily.</li><li>The site depends on grid power with DG backup, local transporters and Chakrata Road access (see the Site Security Plan for the PESTLE and dependency analysis).</li><li>Security is delivered by an on-roll Security In-charge and an outsourced PSARA-licensed agency.</li></ul>'+
     '<h2>3. Summary</h2><table><tr><th>Band</th><th>Requirements</th><th>Timeline</th></tr>'+["Critical","High","Medium","Low"].map(bd=>'<tr><td class="r-'+BAND_DEF.find(r=>r[0]===bd)[2]+'"><b>'+bd+'</b></td><td>'+sd.findings.filter(e=>riskBand(sd.rs(e))[0]===bd).length+'</td><td>'+BAND_TIME[bd]+'</td></tr>').join("")+'</table></section>';
    const groups={};sd.findings.forEach(e=>{const t=topicOf(e);(groups[t]=groups[t]||[]).push(e);});
    let n=0;
    b+='<section class="pb"><h2>4. Requirements by security function</h2>'+Object.keys(groups).sort((a,b2)=>Math.max(...groups[b2].map(sd.rs))-Math.max(...groups[a].map(sd.rs))).map(t=>{const O=OR_TOPIC[t]||["Security In-charge","Requirement met and verified on site."];
      return '<h3>'+esc(t)+'</h3><div class="muted">Owner: '+esc(O[0])+' · Acceptance: '+esc(O[1])+'</div><table><tr><th>Ref</th><th>Requirement (the site shall …)</th><th>Why - audit finding</th><th>Current</th><th>Target</th><th>Timeline</th></tr>'+
        groups[t].map(e=>{n++;const bd=riskBand(sd.rs(e))[0];return '<tr><td><b>OR-'+S.no+'-'+String(n).padStart(2,"0")+'</b></td><td>'+esc(e.extra.rec||"Close the gap described.")+'</td><td><b>'+esc(e.item||"Other")+'</b> '+esc(e.body||"")+(whyOf(e.item)?'<div class="why"><b>Why it matters:</b> '+esc(whyOf(e.item))+'</div>':'')+evidLine(e)+'</td>'+riskCellHTML(e.extra.li,e.extra.im)+(e.extra.tli?riskCellHTML(e.extra.tli,e.extra.tim):'<td>-</td>')+'<td>'+BAND_TIME[bd]+'</td></tr>';}).join("")+'</table>';}).join("")+'</section>';
    b+='<section class="pb"><h2>5. Controls to sustain</h2><p>These controls were found in place and must be kept working; they are part of the requirement baseline.</p><table><tr><th>Point</th><th>Control in place</th><th>Residual risk</th></tr>'+
      sd.obs.filter(e=>(e.sev==="good"||e.sev==="info")&&sd.rs(e)&&e.body).map(e=>'<tr><td><b>'+esc(e.item||"Other")+'</b></td><td>'+esc(e.body)+'</td>'+riskCellHTML(e.extra.li,e.extra.im)+'</tr>').join("")+'</table>'+
      '<h2>6. Verification</h2><ul><li>Each requirement is closed only with evidence (photo, record, test report) reviewed by the Security In-charge and accepted by the Plant Head.</li><li>Electronic systems are accepted after a witnessed test against the acceptance criteria above.</li><li>Closure status is reported monthly against this OR until all Critical and High items are closed.</li></ul></section>';
    return b;});
}
// Corporate SOP set: document hierarchy, governance, nomenclature, and controlled SOPs with formats and role checklists.
// Each SOP: {no,title,purpose,scope:{applies,covers,excludes},defs,resp,steps:[[heading,[step,...]],...],formats:[[no,name,cols,filledBy,reviewedBy,frequency]],records,kpi,ids,rev}
const SOP_SITES="all six Dixon plants at Selaqui, Dehradun (DTSPL; DTSPL - Lighting; Dixon WM; Lightanium; Dixon WM Co. Plant; DTSPL - WM)";
const SOPS=[
{no:"SOP-01",title:"Security governance, document control, exceptions and review",rev:"Plant Heads, HR Head",
 purpose:"To establish one controlled system for the creation, approval, publication, revision, suspension and withdrawal of security documents, for approving exceptions, and for reviewing security performance at site and group level. The aim is that every person on site works to the current approved version, that nobody can change or remove a security rule on their own, and that management sees security performance at a fixed rhythm.",
 scope:{applies:"Group Security office, Plant Heads, Security In-charges, function heads (HR, EHS, IT, Logistics, Stores) and security service providers at "+SOP_SITES+".",covers:"Security policy, manual / Site Security Plan, procedures, SOPs, work instructions, formats and records; change requests, deviations and review meetings.",excludes:"EHS, quality and IT documents, except where they contain security clauses."},
 defs:[["Controlled copy","The current approved version on the document platform. A printed copy is stamped 'Controlled copy - No. __' and is listed on the distribution list."],["Obsolete document","A superseded or withdrawn version. It is removed from use and kept only in the archive; it is never deleted."],["Deviation (exception)","Approved, time-bound permission to depart from one clause of an SOP with a compensating control."],["Suspension","Temporary stop of an SOP clause in an emergency, pending a formal change."]],
 resp:[["Group Security Chief","Owns the security policy, manual and this SOP set; approves SOPs, withdrawals and long deviations; chairs the quarterly review; owns the master list."],["Plant Head","Reviews site documents; approves site annexures, work instructions and short deviations; chairs the monthly site security meeting."],["Security In-charge (site)","Prepares and maintains site documents; raises change and deviation requests; keeps the site master list current; records minutes."],["HR / EHS / IT / Logistics heads","Review documents that touch their function and confirm the resources needed."],["Security service provider","Follows Dixon documents as written; may not issue its own instructions that conflict with them."]],
 steps:[["Creating and approving documents",["Every document is numbered as per Section C, carries the revision number, effective date, next review date and the prepared / reviewed / approved block, and is published only on the single document platform.","A new document or a change is raised on a Document Change Request (F-01-01) stating the reason, the clauses changed, the risk effect and the training needed.","Approval follows the approval matrix in Section B. The person who prepared a document can never be its approver."]],
  ["Publishing and distribution",["On approval the platform publishes the new revision, moves the previous revision to the archive as obsolete and notifies the distribution list automatically.","Printed copies at posts are replaced within 7 days by the Security In-charge, who collects and destroys the old copies and records the exchange on the distribution list.","Affected guards and staff are briefed before the effective date and sign the training record (F-17-01)."]],
  ["Withdrawal, suspension and deletion",["Only the Group Security Chief may withdraw or revoke an SOP, through a change request that states the reason and what replaces it.","In an emergency the Plant Head may suspend a clause for up to 72 hours and must inform the Group Security Chief in writing within 24 hours; the suspension lapses automatically unless a change request is approved.","No document is ever deleted from the platform. Withdrawn and obsolete documents are archived with their history for at least 3 years."]],
  ["Exceptions (deviations)",["Any departure from an SOP needs a Deviation Request (F-01-04) before it starts: the clause, the reason, the risk, the compensating control and the end date.","The Plant Head may approve deviations up to 7 days; longer deviations, any deviation in a Zone 3 area and repeat deviations need the Group Security Chief. Maximum duration is 30 days, renewable once.","No deviation is allowed for statutory requirements, life-safety provisions (such as fail-safe release of doors on escape routes) or the rule that everyone wears an ID.","Open deviations are listed in the deviation register and reviewed in every monthly site meeting."]],
  ["Role-based work instructions and service providers",["Dixon issues its own work instructions for each security role - security supervisor, gate guard, patrol guard, frisking guard (male and female), CCTV / control room operator, quick response team and escort - derived from these SOPs.","Every service provider whose contract covers security work must adhere to these Dixon documents. The obligation is written into the contract (SOP-16), each deployed person signs the work instruction at induction, and adherence is checked in surprise checks; non-adherence is treated as an SLA breach."]],
  ["Review cadence",["Monthly site security meeting chaired by the Plant Head; quarterly security review with the Group Security Chief; half-yearly management review chaired by the Business Head; annual review of the policy, manual, every SOP and Site Security Plan.","An unscheduled review is done after any serious incident, change of layout, new customer requirement or change in law.","Minutes (F-01-03) record decisions, owners and target dates; open actions are carried forward until closed with evidence."]]],
 formats:[["F-01-01","Document change request",["CR no.","Doc no. / rev.","Change requested","Reason / trigger","Risk effect","Raised by / date","Reviewed by / date","Approved by / date","New rev. / effective date"],"Security In-charge","Plant Head, then Group Security Chief","Per change"],
  ["F-01-02","Master list of security documents",["Doc no.","Title","Type","Owner","Rev.","Effective","Next review","Controlled copies issued","Status"],"Security In-charge","Group Security Chief","Updated per change; reviewed quarterly"],
  ["F-01-03","Security review meeting minutes",["Forum","Date","Attendees","Incidents and trends","KPIs","Open actions","Decisions","Owner","Target date"],"Security In-charge","Chair of the meeting","Monthly / quarterly / half-yearly / annual"],
  ["F-01-04","Deviation request and register",["Dev. no.","SOP / clause","Reason","Risk","Compensating control","Start","End","Approved by","Closed on"],"Requesting department","Plant Head (≤ 7 days) / Group Security Chief","Per deviation; reviewed monthly"]],
 records:"Master list, change requests, deviation register and minutes - 3 years; obsolete documents - archived 3 years after withdrawal.",
 kpi:"100 % of security documents numbered, approved and within review date; zero unapproved deviations; meetings held as scheduled and ≥ 90 % of actions closed by the target date.",
 ids:["AD-08","AD-09","AD-10","AD-11","AD-13","AD-14","AD-16"]},

 defs:[["Post order","Signed instruction for one post: duties, checks, prohibited actions, escalation contacts."],["Deployment chart","Post-wise, shift-wise plan of sanctioned against actual guards."]],
 resp:[["Agency supervisor","Prepares the deployment chart, briefs guards, checks posts, reviews the handover register every shift."],["Security In-charge","Countersigns deployment, reconciles attendance, reviews the handover register daily, keeps post orders current."],["Plant Head","Approves the sanctioned strength and any change to it."],["IT","Keeps the biometric attendance server and its backup."]],
 steps:[["Deployment",["The sanctioned strength per post and shift is fixed in the Site Security Plan and the contract; any change needs Plant Head approval.","At every shift start the agency supervisor fills the deployment chart (F-02-01), confirms every post is filled - with female guards wherever women are frisked or escorted - and signs; the Security In-charge countersigns.","A guard who is absent is replaced within 30 minutes. A post left unmanned for more than 30 minutes is reported to the Security In-charge and recorded as an incident."]],
  ["Attendance",["Every guard, supervisor and operator marks attendance on the Dixon biometric (face / fingerprint) system at shift start and end; manual attendance is accepted only during a recorded system failure.","Attendance data is stored on the company server with RAID protection and backed up daily as per IT policy; agency registers do not replace it.","Before certifying the monthly invoice, the Security In-charge reconciles the agency's bill against the biometric report; unexplained differences are deducted."]],
  ["Post orders",["Each post has a current post order (F-02-02) displayed at the post. The guard signs it on first deployment and after every revision.","The supervisor asks each guard at least one post-order question per visit and records the answer in the supervision log."]],
  ["Shift handover",["Handover is done at the post, face to face, and written in the handover register (F-02-03): incidents, keys held, open gate passes and visitors, equipment status and any special instruction.","The agency supervisor reviews and signs the handover register every shift; the Security In-charge reviews and signs it every working day; the register is sampled in the monthly site meeting."]],
  ["Supervision",["The supervisor visits every post at least every 2 hours and records alertness, uniform, post-order knowledge and the condition of equipment (F-02-04).","Repeated lapses by the same guard are reported to the agency for removal from the site."]]],
 formats:[["F-02-01","Daily deployment chart",["Date / shift","Post","Sanctioned","Guard name","ID no.","Biometric in","Relieved by","Supervisor sign","In-charge sign"],"Agency supervisor","Security In-charge","Every shift"],
  ["F-02-02","Post order",["Post name / no.","Duties","Checks to perform","Prohibited actions","Escalation contacts","Rev. / date","Approved by"],"Security In-charge","Plant Head","On change; reviewed yearly"],
  ["F-02-03","Shift handover register",["Date / time","Post","Handed over by","Taken over by","Incidents","Keys held","Open items","Supervisor sign","In-charge sign"],"Outgoing and incoming guard","Supervisor every shift; Security In-charge daily","Every shift"],
  ["F-02-04","Supervision log",["Date / time","Post","Guard","Alert (Y/N)","Uniform / ID (Y/N)","Post-order question and answer","Lapse","Supervisor sign"],"Agency supervisor","Security In-charge","Every 2 hours; reviewed daily"]],
 records:"Deployment charts, handover registers and supervision logs - 1 year; biometric attendance - 3 years on the company server.",

 scope:{applies:"Patrol guards, supervisors, Security In-charges and nominated on-roll managers.",covers:"Perimeter, buildings, critical areas, roof, parking and stores, by day and by night.",excludes:"Static post duties (SOP-02)."},

 steps:[["Routes",["Patrol routes covering the full boundary, every gate, critical areas (DG, transformer, HV panel, HSD, server room, stores, roof) and parking are drawn on the site layout with numbered patrol points.","Routes and timings are varied so that the pattern cannot be predicted."]],

  ["Zones and the access matrix",["Each site classifies every area into Zones 0-3 and records the zone map in its annexure; zone boundaries are marked on the floor or door.","The access matrix (F-04-01) lists for every role the zones and time windows allowed; it is prepared by the Security In-charge, reviewed by zone owners and HR, and approved by the Plant Head."]],
  ["People",["Access is granted only on an approved access request (F-04-02); for Zone 3, Plant Head approval is also needed. IT records the request number when configuring.","Everyone presents their own card or face at every reader. Tailgating, lending a card or propping a door open is a disciplinary matter. Gates and turnstiles work in-out (anti-passback) so presence on site is known at any time.","Zone dress code and visible chest number / QR (SOP-05) allow guards and CCTV to see at a distance whether a person belongs in a zone."]],
